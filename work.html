<title>Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --papel:#F4F5F2;
  --superficie:#FFFFFF;
  --recuo:#EDEFE9;
  --tinta:#1B1F2A;
  --tinta-suave:#5E6673;
  --tinta-fraca:#8A919C;
  --linha:#E1E4DD;
  --linha-forte:#C7CCC2;
  --acento:#2F6F5E;
  --acento-tinta:#255A4C;
  --acento-fundo:#E3EFE9;
  --atraso:#A63B28;
  --andamento:#8C6110;
  --andamento-fundo:#F6EEDC;
  --sombra:0 1px 1px rgba(27,31,42,.04), 0 10px 26px -20px rgba(27,31,42,.45);
  --raio:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#12151A;
    --superficie:#1A1E24;
    --recuo:#232830;
    --tinta:#E9ECE6;
    --tinta-suave:#99A1AC;
    --tinta-fraca:#79818D;
    --linha:#2A3039;
    --linha-forte:#3C4450;
    --acento:#6FB59A;
    --acento-tinta:#8FCBB3;
    --acento-fundo:#1B2E29;
    --atraso:#E9925A;
    --andamento:#D6AC61;
    --andamento-fundo:#2E2617;
    --sombra:0 1px 1px rgba(0,0,0,.3), 0 10px 26px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --papel:#12151A;
  --superficie:#1A1E24;
  --recuo:#232830;
  --tinta:#E9ECE6;
  --tinta-suave:#99A1AC;
  --tinta-fraca:#79818D;
  --linha:#2A3039;
  --linha-forte:#3C4450;
  --acento:#6FB59A;
  --acento-tinta:#8FCBB3;
  --acento-fundo:#1B2E29;
  --atraso:#E9925A;
  --andamento:#D6AC61;
  --andamento-fundo:#2E2617;
  --sombra:0 1px 1px rgba(0,0,0,.3), 0 10px 26px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:"Public Sans","Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.5;
  padding-block:28px 64px;
  padding-inline:16px;
  -webkit-font-smoothing:antialiased;
}
.folha{max-width:680px;margin:0 auto}

:is(button,input,textarea,select):focus-visible{
  outline:2px solid var(--acento);
  outline-offset:2px;
  border-radius:4px;
}

/* ---------- cabeçalho ---------- */
.topo{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px 20px;
}
.topo h1{
  font-family:"Newsreader",Georgia,"Times New Roman",serif;
  font-weight:600;
  font-size:34px;
  line-height:1.1;
  letter-spacing:-.015em;
  margin:0;
  text-wrap:balance;
}
.resumo{
  margin:6px 0 0;
  font-size:13.5px;
  color:var(--tinta-suave);
  font-variant-numeric:tabular-nums;
}
.resumo b{font-weight:600;color:var(--tinta)}
.resumo .vermelho{color:var(--atraso)}
.data-hoje{
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--tinta-fraca);
  padding-bottom:3px;
}

/* ---------- abas ---------- */
.abas{
  display:flex;
  gap:18px;
  margin-top:14px;
  border-bottom:1px solid var(--linha);
}
.abas button{
  border:0;
  background:transparent;
  color:var(--tinta-fraca);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:0 0 9px;
  margin-bottom:-1px;
  border-bottom:2px solid transparent;
  cursor:pointer;
}
.abas button:hover{color:var(--tinta-suave)}
.abas button[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--acento)}

/* ---------- adicionar ---------- */
.adicionar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
  padding:10px;
  background:var(--superficie);
  border:1px solid var(--linha);
  border-radius:var(--raio);
  box-shadow:var(--sombra);
}
.adicionar input.texto{
  flex:1 1 100%;
  min-width:0;
  border:0;
  background:transparent;
  color:var(--tinta);
  font:inherit;
  font-size:15.5px;
  padding:7px 6px;
}
.adicionar input.texto::placeholder{color:var(--tinta-fraca)}
.adicionar input[type="date"]{
  flex:0 0 auto;
  border:1px solid var(--linha);
  border-radius:6px;
  background:var(--papel);
  color:var(--tinta-suave);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12.5px;
  padding:6px 8px;
}
.adicionar input[type="date"]:invalid{border-color:var(--atraso)}
.adicionar .botao-principal{margin-left:auto}
.adicionar select.ciclo{
  flex:0 0 auto;
  border:1px solid var(--linha);
  border-radius:6px;
  background:var(--papel);
  color:var(--tinta-suave);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12px;
  padding:6px 8px;
}
select.chip{
  -webkit-appearance:none;
  appearance:none;
  padding-right:9px;
}

/* par rotulado: um horário com o nome do papel colado nele */
.par{
  display:inline-flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
  border:1px solid var(--linha);
  border-radius:6px;
  background:var(--papel);
  padding:0 8px;
}
.par > span{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--tinta-fraca);
}
.par input{
  border:0;
  background:transparent;
  color:var(--tinta-suave);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12.5px;
  padding:6px 0;
  width:74px;
}
.recado{
  flex:1 0 100%;
  margin:0;
  padding:4px 6px 0;
  font-size:12.5px;
  color:var(--atraso);
}
.botao-principal{
  flex:0 0 auto;
  border:0;
  border-radius:6px;
  background:var(--acento);
  color:#fff;
  font:inherit;
  font-weight:600;
  font-size:14px;
  padding:8px 18px;
  cursor:pointer;
  transition:background .15s ease;
}
:root[data-theme="dark"] .botao-principal,
:root:not([data-theme="light"]) .botao-principal{color:var(--papel)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .botao-principal{color:#fff}}
.botao-principal:hover{background:var(--acento-tinta)}

/* ---------- filtros ---------- */
.filtros{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.filtros button{
  border:1px solid var(--linha);
  background:transparent;
  color:var(--tinta-suave);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;
  letter-spacing:.04em;
  padding:4px 10px;
  border-radius:999px;
  cursor:pointer;
}
.filtros button:hover{border-color:var(--linha-forte);color:var(--tinta)}
.filtros button[aria-pressed="true"]{
  background:var(--acento-fundo);
  border-color:transparent;
  color:var(--acento-tinta);
  font-weight:500;
}

/* ---------- avisos ---------- */
.faixa-aviso{
  margin-top:14px;
  padding:10px 14px;
  border-left:2px solid var(--andamento);
  background:var(--andamento-fundo);
  color:var(--andamento);
  font-size:13.5px;
  border-radius:0 6px 6px 0;
}
.faixa-aviso.resgate{border-left-color:var(--acento);background:var(--acento-fundo);color:var(--acento-tinta)}
.faixa-aviso .titulo-aviso{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;
  letter-spacing:.1em;
  text-transform:uppercase;
  display:block;
  margin-bottom:6px;
  opacity:.85;
}
.faixa-aviso ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.faixa-aviso li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.faixa-aviso .quando{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;
  font-weight:500;
  min-width:52px;
}
.faixa-aviso .restante{
  margin-left:auto;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;
  letter-spacing:.04em;
  white-space:nowrap;
}
.faixa-aviso li.limite .quando,
.faixa-aviso li.limite .restante{font-weight:600}
.acoes-aviso{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px}
.acoes-aviso button{
  border:0;background:transparent;color:inherit;font:inherit;
  font-size:13px;font-weight:600;text-decoration:underline;cursor:pointer;padding:0;
}
.acoes-aviso button.discreto{font-weight:400;text-decoration:none;opacity:.75}
.acoes-aviso button.discreto:hover{text-decoration:underline;opacity:1}

/* ---------- seções / dias ---------- */
.secao{margin-top:24px}
.cabeca-dia{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:4px 10px;
  margin:0 0 8px;
}
.cabeca-dia .nome{
  font-family:"Newsreader",Georgia,serif;
  font-size:19px;
  font-weight:600;
  letter-spacing:-.01em;
  color:var(--tinta);
}
.cabeca-dia .detalhe,
.cabeca-dia .qtd{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--tinta-fraca);
}
.cabeca-dia .qtd{margin-left:auto;font-variant-numeric:tabular-nums}
.secao.urgente .cabeca-dia .nome{color:var(--atraso)}
.painel{
  background:var(--superficie);
  border:1px solid var(--linha);
  border-radius:var(--raio);
  box-shadow:var(--sombra);
  overflow:hidden;
}
.dia-vazio{
  padding:14px 16px;
  font-size:13.5px;
  color:var(--tinta-fraca);
  font-style:italic;
}

/* ---------- item ---------- */
.item{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  column-gap:10px;
  padding:0 12px 0 10px;
  border-left:2px solid transparent;
  border-top:1px solid var(--linha);
}
.item:first-child{border-top:0}
.item.atrasada{border-left-color:var(--atraso)}
.item.andando{border-left-color:var(--andamento)}
.item.aberto{background:var(--recuo)}

.marcar{
  margin-top:10px;
  width:19px;height:19px;
  display:grid;place-items:center;
  border:1.5px solid var(--linha-forte);
  border-radius:50%;
  background:transparent;
  color:var(--acento);
  cursor:pointer;
  padding:0;
  transition:border-color .15s ease, background .15s ease;
}
.marcar svg{width:11px;height:11px;opacity:0;transition:opacity .15s ease}
.marcar:hover{border-color:var(--acento)}
.marcar:hover svg{opacity:.5}
.item.feita .marcar{background:var(--acento);border-color:var(--acento);color:var(--superficie)}
.item.feita .marcar svg{opacity:1}

.linha{
  display:block;
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:inherit;
  font:inherit;
  cursor:pointer;
  padding:8px 0 9px;
}
.titulo{display:block;font-size:15px;line-height:1.35;color:var(--tinta)}
.item.feita .titulo{color:var(--tinta-fraca);text-decoration:line-through;text-decoration-thickness:1px}
.meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:3px 8px;
  margin-top:3px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;
  letter-spacing:.03em;
  color:var(--tinta-fraca);
}
.meta:empty{display:none}
.meta .prazo.vencido,.meta .hora.vencido{color:var(--atraso)}
.meta .hora{font-weight:500;color:var(--tinta-suave)}
.selo{padding:1px 7px;border-radius:999px;background:var(--recuo);color:var(--tinta-suave)}
.item.aberto .selo{background:var(--superficie)}
.selo.andamento{background:var(--andamento-fundo);color:var(--andamento)}
.selo.perto{background:var(--andamento-fundo);color:var(--andamento);font-weight:500}
.selo.faltando{background:transparent;border:1px dashed var(--atraso);color:var(--atraso)}
.selo.ciclo{background:transparent;border:1px solid var(--linha-forte);color:var(--tinta-fraca)}
.selo.iminente{background:var(--andamento);color:var(--papel);font-weight:500}

/* ---------- rascunho aberto ---------- */
.edicao{padding:6px 0 10px}
.escrita{
  display:block;
  width:100%;
  border:0;
  background:transparent;
  color:var(--tinta);
  font:inherit;
  padding:0;
  margin:0;
  resize:none;
  overflow:hidden;
}
.escrita::placeholder{color:var(--tinta-fraca)}
.escrita.titulo-edit{font-size:15px;line-height:1.35;padding:2px 0}
.escrita.nota-edit{
  font-size:13.5px;
  line-height:1.45;
  color:var(--tinta-suave);
  margin-top:3px;
  padding-left:9px;
  border-left:1px solid var(--linha-forte);
}
.ferramentas{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:5px;
  margin-top:8px;
}
.chip{
  border:1px solid var(--linha-forte);
  background:var(--superficie);
  color:var(--tinta-suave);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;
  letter-spacing:.03em;
  line-height:1.4;
  padding:3px 9px;
  border-radius:999px;
  cursor:pointer;
}
.chip:hover{color:var(--tinta);border-color:var(--tinta-fraca)}
.chip.perigo{margin-left:auto;border-color:transparent;color:var(--tinta-fraca)}
.chip.perigo:hover{color:var(--atraso);border-color:var(--atraso)}
input.chip{cursor:text}
input.chip[type="date"]{width:118px;padding-block:2px}
label.chip.par{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:1px 8px;
  cursor:text;
}
label.chip.par > span{
  font-size:9.5px;
  letter-spacing:.08em;
  text-transform:uppercase;
  opacity:.75;
}
label.chip.par input{
  border:0;
  background:transparent;
  color:inherit;
  font:inherit;
  padding:2px 0;
  width:62px;
}
input.chip.categoria{width:108px}
input.chip.categoria::placeholder{color:var(--tinta-fraca)}
input.chip.preenchido{background:var(--acento-fundo);border-color:transparent;color:var(--acento-tinta)}

/* ---------- histórico ---------- */
.periodo{
  display:flex;
  flex-wrap:wrap;
  gap:14px 26px;
  margin-top:20px;
  padding:14px 16px;
  background:var(--superficie);
  border:1px solid var(--linha);
  border-radius:var(--raio);
  box-shadow:var(--sombra);
}
.celula{display:flex;flex-direction:column;gap:1px}
.celula .numero{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:21px;
  font-weight:500;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
  color:var(--tinta);
}
.celula .rotulo{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--tinta-fraca);
}
.celula.boa .numero{color:var(--acento-tinta)}
.celula.ruim .numero{color:var(--atraso)}

.legenda{
  display:flex;
  flex-wrap:wrap;
  gap:6px 16px;
  margin-top:14px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;
  color:var(--tinta-suave);
}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.amostra{width:22px;height:9px;border-radius:3px;display:inline-block}
.amostra.dentro{background:var(--acento)}
.amostra.fora{
  background-color:var(--atraso);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 2px,transparent 2px 5px);
}
.amostra.neutra{background:var(--linha-forte)}

.dia-hist{
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--linha);
}
.dia-hist:first-child{border-top:0;padding-top:0}
.contagens{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;
  letter-spacing:.03em;
  color:var(--tinta-suave);
  font-variant-numeric:tabular-nums;
  margin:2px 0 8px;
}
.trilho{
  height:9px;
  background:var(--recuo);
  border-radius:3px;
  overflow:hidden;
  margin-bottom:10px;
}
.faixa{display:flex;gap:2px;height:100%;min-width:3px}
.tramo{border-radius:3px;min-width:3px}
.tramo.dentro{background:var(--acento)}
.tramo.fora{
  background-color:var(--atraso);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 2px,transparent 2px 5px);
}
.registro{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.registro li{display:block}
.registro-linha{
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:4px 9px;
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  font:inherit;
  font-size:14px;
  color:var(--tinta-suave);
  padding:3px 0 3px 16px;
  position:relative;
  cursor:pointer;
}
.registro-linha:hover{color:var(--tinta)}
.registro-linha .nome{flex:1 1 auto}
.detalhe-hist{
  margin:2px 0 10px 16px;
  padding:11px 13px;
  background:var(--recuo);
  border-radius:8px;
}
.detalhe-hist dl{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  gap:3px 14px;
  margin:0;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;
}
.detalhe-hist dt{
  font-size:10px;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--tinta-fraca);
}
.detalhe-hist dd{margin:0;color:var(--tinta-suave)}
.nota-hist{
  margin:9px 0 0;
  padding-left:9px;
  border-left:1px solid var(--linha-forte);
  font-size:13.5px;
  color:var(--tinta-suave);
  white-space:pre-wrap;
}
.acoes-hist{margin-top:10px}
.registro .marca{
  position:absolute;
  left:0;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12px;
  font-weight:500;
}
.registro .marca.dentro{color:var(--acento-tinta)}
.registro .marca.fora{color:var(--atraso)}
.registro .marca.neutra{color:var(--tinta-fraca)}
.registro .veredito{
  margin-left:auto;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;
  letter-spacing:.05em;
  text-transform:uppercase;
  white-space:nowrap;
}
.registro .veredito.dentro{color:var(--acento-tinta)}
.registro .veredito.fora{color:var(--atraso)}
.registro .veredito.neutra{color:var(--tinta-fraca)}

/* ---------- vazio / rodapé ---------- */
.vazio{
  margin-top:26px;
  padding:34px 20px;
  text-align:center;
  border:1px dashed var(--linha-forte);
  border-radius:var(--raio);
  color:var(--tinta-suave);
}
.vazio p{margin:0}
.vazio p + p{margin-top:6px;font-size:13px;color:var(--tinta-fraca)}
.vazio .serif{font-family:"Newsreader",Georgia,serif;font-size:19px;color:var(--tinta)}
.mais{
  margin-top:16px;
  border:0;background:transparent;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tinta-fraca);cursor:pointer;padding:0;
}
.mais:hover{color:var(--tinta)}
.rodape{
  margin-top:34px;
  padding-top:12px;
  border-top:1px solid var(--linha);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;
  letter-spacing:.06em;
  color:var(--tinta-fraca);
  display:flex;
  flex-wrap:wrap;
  gap:4px 14px;
  justify-content:space-between;
  align-items:baseline;
}
.rodape button{
  border:0;background:transparent;
  font:inherit;color:var(--tinta-suave);
  text-decoration:underline;cursor:pointer;padding:0;

<datalist id="listaCategorias"></datalist>

<script>
(function(){
  "use strict";

  var COLECAO = "atividades";
  var CHAVE_DADOS = "minha-pauta:atividades:v1";
  var CHAVE_PREF  = "minha-pauta:preferencias:v1";
  var CHAVE_AVISADOS = "minha-pauta:avisados:v1";
  var DIAS_VISIVEIS = 10;
  var JANELA_ALERTA = 120;   // minutos: a partir daqui a atividade entra em "daqui a pouco"
  var JANELA_IMINENTE = 15;  // minutos: a partir daqui ela é iminente
  var AVISO_ANTECEDENCIA = 15;

  var estado = {
    tarefas: new Map(),
    vista: "agenda",
    aberto: null,          // uma atividade em edição por vez
    historicoAberto: null, // uma linha do histórico expandida por vez
    protegerAberto: false, // o clique que abriu um rascunho não pode fechá-lo ao borbulhar
    mostrarNota: false,  // a anotação da atividade aberta está à vista
    pendentes: new Set(),
    filtro: "todas",
    verTudo: false,
    modo: "carregando",
    pronto: false,
    assinatura: "",
    espelhoLiberado: true,  // trava enquanto houver dados locais ainda não resolvidos
    resgate: null,          // atividades presas neste navegador, fora da conta
    avisosNavegador: "indisponivel"
  };

  var db = null;
  var temporizadores = new Map();
  var jaAvisados = new Set();

  /* ---------------- utilidades ---------------- */

  function esc(v){
    return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function plural(n, um, muitos){ return n + " " + (n === 1 ? um : muitos); }

  function doisDigitos(n){ return (n < 10 ? "0" : "") + n; }

  function isoDe(d){
    return d.getFullYear() + "-" + doisDigitos(d.getMonth() + 1) + "-" + doisDigitos(d.getDate());
  }

  function isoHoje(){ return isoDe(new Date()); }

  function horaDe(d){ return doisDigitos(d.getHours()) + ":" + doisDigitos(d.getMinutes()); }

  function dataDeIso(iso){
    var p = String(iso).split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  function diaDoCarimbo(carimbo){
    var d = new Date(carimbo);
    return isNaN(d.getTime()) ? "" : isoDe(d);
  }

  function somarDias(iso, n){
    var d = dataDeIso(iso);
    d.setDate(d.getDate() + n);
    return isoDe(d);
  }

  function diasAte(iso){
    return Math.round((dataDeIso(iso) - dataDeIso(isoHoje())) / 86400000);
  }

  function dataLonga(iso){
    return new Intl.DateTimeFormat("pt-BR", { weekday:"long", day:"numeric", month:"long" }).format(dataDeIso(iso));
  }

  function dataCurta(iso){
    var d = dataDeIso(iso);
    var opcoes = { day:"numeric", month:"short" };
    if (d.getFullYear() !== new Date().getFullYear()) opcoes.year = "numeric";
    return new Intl.DateTimeFormat("pt-BR", opcoes).format(d).replace(/\.$/, "");
  }

  function rotuloDia(iso){
    var n = diasAte(iso);
    if (n === 0) return { nome:"Hoje", detalhe: dataLonga(iso) };
    if (n === 1) return { nome:"Amanhã", detalhe: dataLonga(iso) };
    if (n === -1) return { nome:"Ontem", detalhe: dataLonga(iso) };
    return { nome: dataLonga(iso), detalhe: "" };
  }

  function rotuloPrazo(iso){
    var n = diasAte(iso);
    if (n === 0) return "hoje";
    if (n === 1) return "amanhã";
    if (n === -1) return "ontem";
    var texto = dataCurta(iso);
    if (n < -1) return texto + " · " + Math.abs(n) + " dias atrás";
    if (n <= 7) return texto + " · em " + n + " dias";
    return texto;
  }

  function novoId(){
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  function normalizar(id, bruto){
    var d = bruto || {};
    var status = d.status === "concluida" || d.status === "andamento" ? d.status : "aberta";
    return {
      id: id,
      titulo: typeof d.titulo === "string" ? d.titulo : "",
      notas: typeof d.notas === "string" ? d.notas : "",
      prazo: typeof d.prazo === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d.prazo) ? d.prazo : "",
      // `hora` é o campo único das versões antigas: virou o início.
      inicio: validarHora(d.inicio !== undefined ? d.inicio : d.hora),
      limite: validarHora(d.limite),
      categoria: typeof d.categoria === "string" ? d.categoria.trim() : "",
      repete: REPETICOES[d.repete] ? d.repete : "",
      serie: typeof d.serie === "string" ? d.serie : "",
      status: status,
      criadaEm: typeof d.criadaEm === "string" ? d.criadaEm : new Date().toISOString(),
      iniciadaEm: typeof d.iniciadaEm === "string" ? d.iniciadaEm : "",
      concluidaEm: typeof d.concluidaEm === "string" ? d.concluidaEm : ""
    };
  }

  function corpo(t){
    return {
      titulo: t.titulo, notas: t.notas, prazo: t.prazo, inicio: t.inicio, limite: t.limite,
      categoria: t.categoria, repete: t.repete, serie: t.serie, status: t.status,
      criadaEm: t.criadaEm, iniciadaEm: t.iniciadaEm, concluidaEm: t.concluidaEm
    };
  }

  function validarHora(v){
    return typeof v === "string" && /^\d{2}:\d{2}$/.test(v) ? v : "";
  }

  /* ---------------- repetição ---------------- */

  // Cada ciclo sabe se chamar e sabe achar a próxima data a partir de uma dada.
  var REPETICOES = {
    diario:     { rotulo: "todo dia",       proxima: function(d){ return somarDias(d, 1); } },
    uteis:      { rotulo: "dias úteis",     proxima: function(d){
                    var p = somarDias(d, 1);
                    while ([0, 6].indexOf(dataDeIso(p).getDay()) !== -1) p = somarDias(p, 1);
                    return p;
                  } },
    semanal:    { rotulo: "toda semana",    proxima: function(d){ return somarDias(d, 7); } },
    quinzenal:  { rotulo: "a cada 15 dias", proxima: function(d){ return somarDias(d, 14); } },
    mensal:     { rotulo: "todo mês",       proxima: function(d){
                    var base = dataDeIso(d), dia = base.getDate();
                    var alvo = new Date(base.getFullYear(), base.getMonth() + 1, 1);
                    // 31 de janeiro repetido em fevereiro cai no último dia do mês.
                    var ultimo = new Date(alvo.getFullYear(), alvo.getMonth() + 1, 0).getDate();
                    alvo.setDate(Math.min(dia, ultimo));
                    return isoDe(alvo);
                  } }
  };

  /* ---------------- prazo ---------------- */

  // O instante em que a atividade tinha de estar pronta. Com prazo limite
  // marcado, é aquele minuto; sem ele, o fim do dia do prazo.
  function instanteLimite(t){
    if (!t.prazo) return null;
    var d = dataDeIso(t.prazo);
    if (t.limite) {
      var p = t.limite.split(":");
      d.setHours(Number(p[0]), Number(p[1]), 0, 0);
    } else {
      d.setHours(23, 59, 59, 999);
    }
    return d;
  }

  // O mesmo instante, mas para uma hora avulsa de hoje (início ou limite).
  function instanteHoje(hhmm){
    var p = hhmm.split(":");
    var d = new Date();
    d.setHours(Number(p[0]), Number(p[1]), 0, 0);
    return d;
  }

  // Estourou o prazo: o dia passou, ou o limite de hoje já venceu. O início
  // nunca atrasa nada — uma reunião das 17h não está atrasada às 17h05.
  function estaAtrasada(t, hoje){
    if (t.status === "concluida" || !t.prazo) return false;
    if (t.prazo < hoje) return true;
    return t.prazo === hoje && !!t.limite && t.limite < horaDe(new Date());
  }

  // Calculado na hora a partir do prazo e da conclusão, nunca congelado:
  // corrigir o prazo de algo já concluído corrige também o veredito.
  function veredito(t){
    if (t.status !== "concluida" || !t.prazo || !t.concluidaEm) return null;
    var lim = instanteLimite(t);
    if (!lim) return null;
    return new Date(t.concluidaEm).getTime() <= lim.getTime();
  }

  function atrasoTexto(t){
    var lim = instanteLimite(t);
    if (!lim || !t.concluidaEm) return "";
    var min = Math.round((new Date(t.concluidaEm).getTime() - lim.getTime()) / 60000);
    if (min <= 0) return "";
    if (min < 60) return min + " min depois";
    var horas = Math.floor(min / 60), resto = min % 60;
    if (horas < 24) return horas + "h" + (resto ? doisDigitos(resto) : "") + " depois";
    return plural(Math.round(horas / 24), "dia depois", "dias depois");
  }

  // Os momentos de hoje que ainda vão chegar: o começo e o limite.
  function marcos(t, hoje){
    if (t.status === "concluida" || t.prazo !== hoje) return [];
    var agora = Date.now(), lista = [];
    ["inicio", "limite"].forEach(function(tipo){
      if (!t[tipo]) return;
      lista.push({ tipo: tipo, hora: t[tipo], min: Math.round((instanteHoje(t[tipo]) - agora) / 60000) });
    });
    return lista;
  }

  // O próximo marco dentro da janela de alerta, se houver.
  function marcoProximo(t, hoje){
    var candidatos = marcos(t, hoje).filter(function(m){ return m.min >= 0 && m.min <= JANELA_ALERTA; });
    candidatos.sort(function(a, b){ return a.min - b.min; });
    return candidatos[0] || null;
  }

  function emQuanto(min){
    if (min <= 0) return "agora";
    if (min < 60) return "em " + min + " min";
    var h = Math.floor(min / 60), m = min % 60;
    return "em " + h + "h" + (m ? doisDigitos(m) : "");
  }

  // "17:00–18:00", "17:00", "até 20:00" — como a linha mostra seus horários.
  function faixaHoraria(t){
    if (t.inicio && t.limite) return t.inicio + "–" + t.limite;
    if (t.inicio) return t.inicio;
    if (t.limite) return "até " + t.limite;
    return "";
  }

  function horaDeOrdem(t){ return t.inicio || t.limite || "99:99"; }

  /* ---------------- preferências (só deste navegador) ---------------- */

  function lerPreferencias(){
    try {
      var cru = window.localStorage.getItem(CHAVE_PREF);
      if (cru) {
        var p = JSON.parse(cru);
        if (typeof p.filtro === "string") estado.filtro = p.filtro;
        if (p.vista === "historico" || p.vista === "agenda") estado.vista = p.vista;
      }
      var avisados = window.localStorage.getItem(CHAVE_AVISADOS);
      if (avisados) {
        var a = JSON.parse(avisados);
        if (a && a.dia === isoHoje() && Array.isArray(a.ids)) a.ids.forEach(function(i){ jaAvisados.add(i); });
      }
    } catch (e) { /* navegação privada ou armazenamento bloqueado */ }
  }

  function gravarPreferencias(){
    try {
      window.localStorage.setItem(CHAVE_PREF, JSON.stringify({
        filtro: estado.filtro, vista: estado.vista
      }));
    } catch (e) { /* segue sem lembrar */ }
  }

  function gravarAvisados(){
    try {
      window.localStorage.setItem(CHAVE_AVISADOS, JSON.stringify({
        dia: isoHoje(), ids: Array.from(jaAvisados)
      }));
    } catch (e) { /* segue sem lembrar */ }
  }

  /* ---------------- armazenamento ---------------- */

  function lerLocal(){
    try {
      var cru = window.localStorage.getItem(CHAVE_DADOS);
      if (!cru) return [];
      var lista = JSON.parse(cru);
      return Array.isArray(lista) ? lista.filter(function(i){ return i && i.id; }) : [];
    } catch (e) { return []; }
  }

  function gravarLocal(){
    if (!estado.espelhoLiberado) return;
    try {
      var lista = [];
      estado.tarefas.forEach(function(t){ lista.push(Object.assign({ id: t.id }, corpo(t))); });
      window.localStorage.setItem(CHAVE_DADOS, JSON.stringify(lista));
    } catch (e) { /* sem espaço ou bloqueado */ }
  }

  function usarModoLocal(){
    db = null;
    if (estado.tarefas.size === 0) {
      lerLocal().forEach(function(item){ estado.tarefas.set(item.id, normalizar(item.id, item)); });
    }
    estado.modo = "local";
    estado.espelhoLiberado = true;
    estado.pronto = true;
    desenhar();
  }

  // Dados gravados numa sessão sem nuvem ficam presos no navegador. Antes de
  // sobrescrever o espelho local, confere se há algo aqui que a conta não tem.
  function conferirResgate(mapa){
    if (estado.resgate) return;
    var presos = lerLocal().filter(function(item){ return !mapa.has(item.id); });
    if (presos.length) {
      estado.resgate = presos;
      estado.espelhoLiberado = false;
    } else {
      estado.espelhoLiberado = true;
      gravarLocal();
    }
  }

  function importarPresos(){
    var presos = estado.resgate || [];
    estado.resgate = null;
    presos.forEach(function(item){
      var t = normalizar(item.id, item);
      estado.tarefas.set(t.id, t);
      gravar(t);
    });
    estado.espelhoLiberado = true;
    gravarLocal();
    desenhar();
  }

  function descartarPresos(){
    estado.resgate = null;
    estado.espelhoLiberado = true;
    gravarLocal();
    desenhar();
  }

  function assinarColecao(){
    db.collection(COLECAO).onSnapshot(function(snap){
      var mapa = new Map();
      snap.docs.forEach(function(doc){
        var dados = doc.data();
        if (dados) mapa.set(doc.id, normalizar(doc.id, dados));
      });
      // Uma edição ainda não confirmada continua valendo sobre o que o servidor devolveu.
      estado.pendentes.forEach(function(id){
        var local = estado.tarefas.get(id);
        if (local) mapa.set(id, local); else mapa.delete(id);
      });
      estado.tarefas = mapa;
      estado.pronto = true;
      conferirResgate(mapa);
      gravarLocal();
      desenhar();
    }, function(){
      usarModoLocal();
    });
  }

  function conectar(){
    var pedido = null;
    try { pedido = window.claude && window.claude.use ? window.claude.use("db") : null; }
    catch (e) { pedido = null; }

    if (!pedido || typeof pedido.then !== "function") { usarModoLocal(); return; }

    pedido.then(function(ns){
      if (!ns) { usarModoLocal(); return; }
      db = ns;
      estado.modo = "nuvem";
      estado.espelhoLiberado = false;
      assinarColecao();
    }, function(){ usarModoLocal(); });
  }

  function tentarNuvemDeNovo(){
    var alvo = document.getElementById("modoArmazenamento");
    if (alvo) alvo.textContent = "Pedindo acesso…";
    var p = null;
    try { p = window.claude && window.claude.use ? window.claude.use("permissions") : null; }
    catch (e) { p = null; }
    if (!p || typeof p.then !== "function") { desenhar(); return; }
    p.then(function(ns){
      if (!ns) { desenhar(); return; }
      return ns.request(["db"]).then(function(){ conectar(); });
    }).catch(function(){ desenhar(); });
  }

  function gravar(t){
    estado.tarefas.set(t.id, t);
    gravarLocal();
    if (!db) return;
    estado.pendentes.add(t.id);
    db.collection(COLECAO).doc(t.id).set(corpo(t)).then(function(){
      estado.pendentes.delete(t.id);
    }, function(erro){
      estado.pendentes.delete(t.id);
      relatar(erro);
    });
  }

  function remover(id){
    estado.tarefas.delete(id);
    if (estado.aberto === id) estado.aberto = null;
    gravarLocal();
    if (!db) return;
    estado.pendentes.add(id);
    db.collection(COLECAO).doc(id).delete().then(function(){
      estado.pendentes.delete(id);
    }, function(erro){
      estado.pendentes.delete(id);
      relatar(erro);
    });
  }

  function relatar(erro){
    var codigo = erro && erro.code;
    var texto = "Não consegui salvar essa mudança. Tente de novo.";
    if (codigo === "quota_exceeded") texto = "A agenda atingiu o limite de atividades guardadas. Apague algumas concluídas para abrir espaço.";
    else if (codigo === "resource_exhausted") texto = "Muitas mudanças de uma vez. Espere um instante e repita.";
    else if (codigo === "revoked" || codigo === "not_granted") texto = "Perdi o acesso ao armazenamento desta página. Recarregue para continuar.";
    var alvo = document.getElementById("modoArmazenamento");
    if (alvo) alvo.textContent = texto;
  }

  function adiar(id, fn){
    if (temporizadores.has(id)) window.clearTimeout(temporizadores.get(id));
    temporizadores.set(id, window.setTimeout(function(){
      temporizadores.delete(id);
      fn();
    }, 700));
  }

  /* ---------------- avisos do navegador ---------------- */

  function estadoAvisos(){
    if (typeof window.Notification === "undefined") return "indisponivel";
    try { return window.Notification.permission; } catch (e) { return "indisponivel"; }
  }

  function pedirAvisos(){
    if (typeof window.Notification === "undefined") return;
    try {
      var r = window.Notification.requestPermission();
      if (r && typeof r.then === "function") {
        r.then(function(){ estado.avisosNavegador = estadoAvisos(); desenhar(); },
               function(){ estado.avisosNavegador = "denied"; desenhar(); });
      } else {
        estado.avisosNavegador = estadoAvisos();
        desenhar();
      }
    } catch (e) {
      estado.avisosNavegador = "indisponivel";
      desenhar();
    }
  }

  function dispararAvisos(hoje){
    if (estado.avisosNavegador !== "granted") return;
    estado.tarefas.forEach(function(t){
      marcos(t, hoje).forEach(function(m){
        if (m.min > AVISO_ANTECEDENCIA || m.min < -1) return;
        var chave = t.id + ":" + m.tipo;
        if (jaAvisados.has(chave)) return;
        jaAvisados.add(chave);
        try {
          new window.Notification(t.titulo || "Atividade sem título", {
            body: (m.tipo === "limite" ? "Prazo limite " : "Começa ") + m.hora + " · " + emQuanto(m.min),
            tag: "work-" + chave
          });
        } catch (e) { /* o navegador pode recusar sem aviso */ }
      });
    });
    gravarAvisados();
  }

  /* ---------------- foco e altura ---------------- */

  function capturarFoco(){
    var el = document.activeElement;
    if (!el || !el.id) return null;
    var f = { id: el.id };
    try { if (typeof el.selectionStart === "number") { f.ini = el.selectionStart; f.fim = el.selectionEnd; } }
    catch (e) { /* campos de data e hora não expõem seleção */ }
    return f;
  }

  function restaurarFoco(f){
    if (!f) return;
    var el = document.getElementById(f.id);
    if (!el) return;
    try {
      el.focus({ preventScroll: true });
      if (typeof f.ini === "number" && el.setSelectionRange) el.setSelectionRange(f.ini, f.fim);
    } catch (e) { /* ignora */ }
  }

  function crescer(el){
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  /* ---------------- agenda ---------------- */

  function metaHtml(t, hoje, comData){
    var partes = [];
    // Sem prazo não há como julgar a entrega: a atividade fica pedindo um.
    if (t.status !== "concluida" && !t.prazo) partes.push('<span class="selo faltando">falta o prazo</span>');
    if (t.status === "andamento") partes.push('<span class="selo andamento">em andamento</span>');

    var m = marcoProximo(t, hoje);
    if (m) {
      partes.push('<span class="selo ' + (m.min <= JANELA_IMINENTE ? "iminente" : "perto") + '">' +
        (m.tipo === "limite" ? "limite " : "começa ") + esc(emQuanto(m.min)) + "</span>");
    }

    var vencido = estaAtrasada(t, hoje);
    if (t.prazo && comData) partes.push('<span class="prazo' + (vencido ? " vencido" : "") + '">' + esc(rotuloPrazo(t.prazo)) + "</span>");
    var faixa = faixaHoraria(t);
    if (faixa) partes.push('<span class="hora' + (vencido ? " vencido" : "") + '">' + esc(faixa) + "</span>");
    if (t.categoria) partes.push('<span class="selo">' + esc(t.categoria) + "</span>");
    if (t.repete) partes.push('<span class="selo ciclo">⟳ ' + esc(REPETICOES[t.repete].rotulo) + "</span>");
    return partes.join("");
  }

  function opcoesRepeticao(atual){
    var html = '<option value=""' + (atual ? "" : " selected") + ">não repete</option>";
    Object.keys(REPETICOES).forEach(function(k){
      html += '<option value="' + k + '"' + (atual === k ? " selected" : "") + ">" +
        esc(REPETICOES[k].rotulo) + "</option>";
    });
    return html;
  }

  function corpoAbertoHtml(t){
    var comNota = estado.mostrarNota || !!t.notas;
    var html = '<div class="edicao">' +
      '<textarea class="escrita titulo-edit" id="titulo-' + esc(t.id) + '" data-campo="titulo" rows="1" ' +
        'aria-label="Título da atividade" placeholder="Escreva a atividade…">' + esc(t.titulo) + "</textarea>";

    if (comNota) {
      html += '<textarea class="escrita nota-edit" id="notas-' + esc(t.id) + '" data-campo="notas" rows="1" ' +
        'aria-label="Anotação" placeholder="anotação…">' + esc(t.notas) + "</textarea>";
    }

    html += '<div class="ferramentas">' +
      '<input type="date" class="chip' + (t.prazo ? " preenchido" : "") + '" id="prazo-' + esc(t.id) + '" ' +
        'data-campo="prazo" aria-label="Dia" value="' + esc(t.prazo) + '">';

    if (t.prazo) {
      html += '<label class="chip par' + (t.inicio ? " preenchido" : "") + '"><span>início</span>' +
        '<input type="time" id="inicio-' + esc(t.id) + '" data-campo="inicio" aria-label="Hora de início" value="' + esc(t.inicio) + '"></label>' +
        '<label class="chip par' + (t.limite ? " preenchido" : "") + '"><span>limite</span>' +
        '<input type="time" id="limite-' + esc(t.id) + '" data-campo="limite" aria-label="Prazo limite" value="' + esc(t.limite) + '"></label>';
    }

    html += '<input type="text" class="chip categoria' + (t.categoria ? " preenchido" : "") + '" id="categoria-' + esc(t.id) + '" ' +
        'data-campo="categoria" list="listaCategorias" maxlength="40" placeholder="categoria" ' +
        'aria-label="Categoria" value="' + esc(t.categoria) + '">' +
      '<select class="chip' + (t.repete ? " preenchido" : "") + '" id="repete-' + esc(t.id) + '" ' +
        'data-campo="repete" aria-label="Repetição">' + opcoesRepeticao(t.repete) + "</select>" +
      '<button type="button" class="chip" data-acao="andamento">' + (t.status === "andamento" ? "pausar" : "começar") + "</button>";

    if (!comNota) html += '<button type="button" class="chip" data-acao="nota">+ anotação</button>';
    if (t.repete) html += '<button type="button" class="chip" data-acao="pular">pular</button>';
    html += '<button type="button" class="chip" data-acao="duplicar">duplicar</button>';

    html += '<button type="button" class="chip perigo" data-acao="excluir">excluir</button>' +
      "</div></div>";
    return html;
  }

  function itemHtml(t, hoje, comData){
    var aberto = estado.aberto === t.id;
    var feita = t.status === "concluida";
    var classes = ["item"];
    if (feita) classes.push("feita");
    else if (t.status === "andamento") classes.push("andando");
    else if (estaAtrasada(t, hoje)) classes.push("atrasada");
    if (aberto) classes.push("aberto");

    var rotuloBotao = (feita ? "Reabrir" : "Concluir") + ": " + (t.titulo || "atividade sem título");

    var interior = aberto
      ? corpoAbertoHtml(t)
      : '<button type="button" class="linha" data-acao="abrir">' +
          '<span class="titulo">' + (t.titulo ? esc(t.titulo) : "<em>sem título</em>") + "</span>" +
          '<span class="meta">' + metaHtml(t, hoje, comData) + "</span>" +
        "</button>";

    return '<article class="' + classes.join(" ") + '" data-id="' + esc(t.id) + '">' +
      '<button type="button" class="marcar" data-acao="alternar" aria-pressed="' + feita + '" aria-label="' + esc(rotuloBotao) + '">' +
        '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 8.4l3.2 3.2 6.4-7.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      "</button>" + interior + "</article>";
  }

  function cabecaHtml(nome, detalhe, qtd){
    return '<div class="cabeca-dia"><span class="nome">' + esc(nome) + "</span>" +
      (detalhe ? '<span class="detalhe">' + esc(detalhe) + "</span>" : "") +
      (qtd ? '<span class="qtd">' + esc(qtd) + "</span>" : "") +
    "</div>";
  }

  function porHorario(a, b){
    var ha = horaDeOrdem(a), hb = horaDeOrdem(b);
    if (ha !== hb) return ha < hb ? -1 : 1;
    return a.criadaEm < b.criadaEm ? -1 : 1;
  }

  function desenharAgenda(visiveis, hoje){
    var html = "";

    var atrasadas = [], semData = [], porDia = new Map(), concluidasHoje = [];
    visiveis.forEach(function(t){
      if (t.status === "concluida") {
        if (diaDoCarimbo(t.concluidaEm) === hoje) concluidasHoje.push(t);
        return;
      }
      if (estaAtrasada(t, hoje)) { atrasadas.push(t); return; }
      if (!t.prazo) { semData.push(t); return; }
      if (!porDia.has(t.prazo)) porDia.set(t.prazo, []);
      porDia.get(t.prazo).push(t);
    });

    atrasadas.sort(function(a, b){
      var ka = a.prazo + (a.limite || horaDeOrdem(a)), kb = b.prazo + (b.limite || horaDeOrdem(b));
      if (ka !== kb) return ka < kb ? -1 : 1;
      return a.criadaEm < b.criadaEm ? -1 : 1;
    });

    if (atrasadas.length) {
      html += '<section class="secao urgente">' +
        cabecaHtml("Passou do prazo", "", String(atrasadas.length)) +
        '<div class="painel">' +
          atrasadas.map(function(t){ return itemHtml(t, hoje, true); }).join("") +
        "</div></section>";
    }

    // O dia de hoje sempre aparece; os demais só quando têm algo marcado.
    var dias = Array.from(porDia.keys()).filter(function(d){ return d >= hoje; });
    if (dias.indexOf(hoje) === -1) dias.push(hoje);
    dias.sort();

    dias.forEach(function(dia){
      var itens = (porDia.get(dia) || []).slice().sort(porHorario);
      if (dia === hoje) itens = itens.concat(concluidasHoje);
      var r = rotuloDia(dia);
      html += '<section class="secao">' + cabecaHtml(r.nome, r.detalhe, itens.length ? String(itens.length) : "");
      html += itens.length
        ? '<div class="painel">' + itens.map(function(t){ return itemHtml(t, hoje, false); }).join("") + "</div>"
        : '<div class="painel"><p class="dia-vazio">Nada marcado para hoje.</p></div>';
      html += "</section>";
    });

    if (semData.length) {
      semData.sort(function(a, b){
        if ((a.status === "andamento") !== (b.status === "andamento")) return a.status === "andamento" ? -1 : 1;
        return a.criadaEm < b.criadaEm ? -1 : 1;
      });
      html += '<section class="secao">' +
        cabecaHtml("Sem prazo", "precisam de um prazo", String(semData.length)) +
        '<div class="painel">' + semData.map(function(t){ return itemHtml(t, hoje, false); }).join("") + "</div></section>";
    }

    return html;
  }

  /* ---------------- alertas de proximidade ---------------- */

  function desenharAlertas(visiveis, hoje){
    var alvo = document.getElementById("faixaAlertas");
    if (estado.vista !== "agenda") { alvo.innerHTML = ""; return; }

    var proximas = [];
    visiveis.forEach(function(t){
      marcos(t, hoje).forEach(function(m){
        if (m.min >= 0 && m.min <= JANELA_ALERTA) proximas.push({ t: t, m: m });
      });
    });
    proximas.sort(function(a, b){ return a.m.min - b.m.min; });

    var podePedir = estado.avisosNavegador === "default";
    if (!proximas.length && !podePedir) { alvo.innerHTML = ""; return; }

    var html = '<div class="faixa-aviso">';
    if (proximas.length) {
      html += '<span class="titulo-aviso">Daqui a pouco</span><ul>';
      proximas.slice(0, 4).forEach(function(p){
        html += '<li' + (p.m.tipo === "limite" ? ' class="limite"' : "") + ">" +
          '<span class="quando">' + esc(p.m.hora) + "</span>" +
          "<span>" + (p.t.titulo ? esc(p.t.titulo) : "<em>sem título</em>") + "</span>" +
          '<span class="restante">' + (p.m.tipo === "limite" ? "limite " : "começa ") + esc(emQuanto(p.m.min)) + "</span></li>";
      });
      html += "</ul>";
    } else {
      html += '<span class="titulo-aviso">Avisos</span>' +
        "<span>Nada nas próximas duas horas.</span>";
    }

    if (podePedir) {
      html += '<div class="acoes-aviso"><button type="button" data-aviso="pedir">Avisar no navegador</button>' +
        '<button type="button" class="discreto" data-aviso="dispensar">agora não</button></div>';
    } else if (estado.avisosNavegador === "denied") {
      html += '<div class="acoes-aviso"><span style="font-size:12.5px;opacity:.8">O navegador bloqueou avisos nesta página — os alertas ficam só aqui.</span></div>';
    }

    alvo.innerHTML = html + "</div>";
  }

  function desenharResgate(){
    var alvo = document.getElementById("faixaResgate");
    if (!estado.resgate || !estado.resgate.length) { alvo.innerHTML = ""; return; }
    alvo.innerHTML = '<div class="faixa-aviso resgate">' +
      '<span class="titulo-aviso">Atividades fora da conta</span>' +
      "<span>" + plural(estado.resgate.length, "atividade foi salva", "atividades foram salvas") +
      " só neste navegador, numa sessão em que a nuvem não estava disponível. " +
      "Trazer para a sua conta faz " + (estado.resgate.length === 1 ? "ela aparecer" : "elas aparecerem") + " nos outros dispositivos.</span>" +
      '<div class="acoes-aviso">' +
        '<button type="button" data-resgate="importar">Trazer para a conta</button>' +
        '<button type="button" class="discreto" data-resgate="descartar">manter só aqui</button>' +
      "</div></div>";
  }

  /* ---------------- histórico ---------------- */

  function agregar(visiveis){
    var mapa = new Map();
    function dia(d){
      if (!mapa.has(d)) mapa.set(d, { dia:d, criadas:0, iniciadas:0, feitas:[], dentro:0, fora:0, semPrazo:0 });
      return mapa.get(d);
    }
    visiveis.forEach(function(t){
      var d;
      d = diaDoCarimbo(t.criadaEm);   if (d) dia(d).criadas++;
      d = diaDoCarimbo(t.iniciadaEm); if (d) dia(d).iniciadas++;
      d = diaDoCarimbo(t.concluidaEm);
      if (d && t.status === "concluida") {
        var r = dia(d), v = veredito(t);
        r.feitas.push(t);
        if (v === true) r.dentro++;
        else if (v === false) r.fora++;
        else r.semPrazo++;
      }
    });
    return Array.from(mapa.values()).sort(function(a, b){ return a.dia > b.dia ? -1 : 1; });
  }

  function carimboLegivel(iso){
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "—";
    return dataCurta(isoDe(d)) + ", " + horaDe(d);
  }

  // O que o histórico mostra ao abrir uma linha: a atividade inteira, não só
  // o fato de ter sido concluída.
  function detalheHistoricoHtml(t){
    var faixa = faixaHoraria(t);
    var linhas = [];
    linhas.push(["prazo", t.prazo ? dataCurta(t.prazo) + (faixa ? " · " + faixa : "") : "sem prazo"]);
    if (t.categoria) linhas.push(["categoria", t.categoria]);
    if (t.repete) linhas.push(["repete", REPETICOES[t.repete].rotulo]);
    linhas.push(["criada", carimboLegivel(t.criadaEm)]);
    if (t.iniciadaEm) linhas.push(["iniciada", carimboLegivel(t.iniciadaEm)]);
    linhas.push(["concluída", carimboLegivel(t.concluidaEm)]);

    var html = '<div class="detalhe-hist"><dl>';
    linhas.forEach(function(l){
      html += "<dt>" + esc(l[0]) + "</dt><dd>" + esc(l[1]) + "</dd>";
    });
    html += "</dl>";
    if (t.notas) html += '<p class="nota-hist">' + esc(t.notas) + "</p>";
    html += '<div class="acoes-hist">' +
      '<button type="button" class="chip" data-acao="reabrir" data-id="' + esc(t.id) + '">reabrir na agenda</button>' +
    "</div>";
    return html + "</div>";
  }

  function celulaHtml(n, rotulo, tom){
    return '<div class="celula' + (tom ? " " + tom : "") + '">' +
      '<span class="numero">' + n + "</span>" +
      '<span class="rotulo">' + esc(rotulo) + "</span></div>";
  }

  function diaHistoricoHtml(r, teto){
    var total = r.feitas.length;
    var rot = rotuloDia(r.dia);

    var html = '<article class="dia-hist">' + cabecaHtml(rot.nome, rot.detalhe, "");
    html += '<p class="contagens">' +
      r.criadas + " criadas · " + r.iniciadas + " iniciadas · " + total + " concluídas</p>";

    if (total) {
      var largura = Math.max(6, Math.round((total / teto) * 100));
      var descricao = r.dentro + " no prazo, " + r.fora + " fora do prazo" +
        (r.semPrazo ? ", " + r.semPrazo + " sem prazo definido" : "");
      html += '<div class="trilho"><div class="faixa" style="width:' + largura + '%" role="img" aria-label="' + esc(descricao) + '">';
      if (r.dentro) html += '<span class="tramo dentro" style="flex:' + r.dentro + '"></span>';
      if (r.fora) html += '<span class="tramo fora" style="flex:' + r.fora + '"></span>';
      if (r.semPrazo) html += '<span class="tramo" style="flex:' + r.semPrazo + ';background:var(--linha-forte)"></span>';
      html += "</div></div>";

      html += '<ul class="registro">';
      r.feitas.slice().sort(function(a, b){ return a.concluidaEm < b.concluidaEm ? -1 : 1; }).forEach(function(t){
        var v = veredito(t);
        var tom = v === true ? "dentro" : (v === false ? "fora" : "neutra");
        var marca = v === true ? "✓" : (v === false ? "!" : "·");
        var texto = v === true ? "no prazo" : (v === false ? (atrasoTexto(t) || "fora do prazo") : "sem prazo");
        var aberta = estado.historicoAberto === t.id;
        html += "<li>" +
          '<button type="button" class="registro-linha" data-acao="verHistorico" data-id="' + esc(t.id) + '" ' +
            'aria-expanded="' + aberta + '">' +
            '<span class="marca ' + tom + '" aria-hidden="true">' + marca + "</span>" +
            '<span class="nome">' + (t.titulo ? esc(t.titulo) : "<em>sem título</em>") + "</span>" +
            '<span class="veredito ' + tom + '">' + esc(texto) + "</span>" +
          "</button>" +
          (aberta ? detalheHistoricoHtml(t) : "") +
        "</li>";
      });
      html += "</ul>";
    }

    return html + "</article>";
  }

  function desenharHistorico(visiveis, hoje){
    var registros = agregar(visiveis);
    if (!registros.length) {
      return '<div class="vazio"><p class="serif">O histórico começa agora.</p>' +
        "<p>Conforme você criar, começar e concluir atividades, cada dia vira uma linha aqui.</p></div>";
    }

    var corte = somarDias(hoje, -6);
    var soma = { criadas:0, iniciadas:0, feitas:0, dentro:0, fora:0 };
    registros.forEach(function(r){
      if (r.dia < corte || r.dia > hoje) return;
      soma.criadas += r.criadas;
      soma.iniciadas += r.iniciadas;
      soma.feitas += r.feitas.length;
      soma.dentro += r.dentro;
      soma.fora += r.fora;
    });

    var html = '<section class="secao">' +
      cabecaHtml("Últimos 7 dias", dataCurta(corte) + " – " + dataCurta(hoje), "") +
      '<div class="periodo">' +
        celulaHtml(soma.criadas, "criadas", "") +
        celulaHtml(soma.iniciadas, "iniciadas", "") +
        celulaHtml(soma.feitas, "concluídas", "") +
        celulaHtml(soma.dentro, "no prazo", "boa") +
        celulaHtml(soma.fora, "fora do prazo", "ruim") +
      "</div>" +
      '<div class="legenda">' +
        '<span><i class="amostra dentro"></i>entregue no prazo</span>' +
        '<span><i class="amostra fora"></i>entregue fora do prazo</span>' +
        '<span><i class="amostra neutra"></i>sem prazo definido</span>' +
      "</div></section>";

    // A escala das barras é comum a todos os dias mostrados, para poderem ser comparados.
    var mostrados = estado.verTudo ? registros : registros.slice(0, DIAS_VISIVEIS);
    var teto = 1;
    mostrados.forEach(function(r){ if (r.feitas.length > teto) teto = r.feitas.length; });

    html += '<section class="secao">';
    mostrados.forEach(function(r){ html += diaHistoricoHtml(r, teto); });
    html += "</section>";

    if (registros.length > DIAS_VISIVEIS) {
      html += '<button type="button" class="mais" data-acao="verTudo">' +
        (estado.verTudo ? "Mostrar menos" : "Ver todos os " + registros.length + " dias") + "</button>";
    }
    return html;
  }

  /* ---------------- desenho ---------------- */

  // Muda quando vira o dia, quando algo passa do prazo ou quando uma contagem
  // regressiva visível avança — só então vale redesenhar sozinho.
  function assinaturaTempo(){
    var hoje = isoHoje(), partes = [];
    estado.tarefas.forEach(function(t){
      if (estaAtrasada(t, hoje)) partes.push("a:" + t.id);
      marcos(t, hoje).forEach(function(m){
        if (m.min >= 0 && m.min <= JANELA_ALERTA) partes.push("p:" + t.id + ":" + m.tipo + ":" + m.min);
      });
    });
    return hoje + "|" + partes.sort().join(",");
  }

  function desenhar(){
    var foco = capturarFoco();
    var hoje = isoHoje();
    var todas = Array.from(estado.tarefas.values());

    if (estado.aberto && !estado.tarefas.has(estado.aberto)) estado.aberto = null;

    var categorias = [];
    todas.forEach(function(t){
      if (t.categoria && categorias.indexOf(t.categoria) === -1) categorias.push(t.categoria);
    });
    categorias.sort(function(a, b){ return a.localeCompare(b, "pt-BR"); });
    if (estado.filtro !== "todas" && categorias.indexOf(estado.filtro) === -1) estado.filtro = "todas";

    var visiveis = estado.filtro === "todas"
      ? todas
      : todas.filter(function(t){ return t.categoria === estado.filtro; });

    var naAgenda = estado.vista === "agenda";

    Array.prototype.forEach.call(document.querySelectorAll("#abas button"), function(b){
      b.setAttribute("aria-selected", String(b.getAttribute("data-vista") === estado.vista));
    });
    document.getElementById("formAdd").hidden = !naAgenda;

    // Resumo
    var abertas = 0, atrasadas = 0, deHoje = 0;
    visiveis.forEach(function(t){
      if (t.status === "concluida") return;
      abertas++;
      if (estaAtrasada(t, hoje)) atrasadas++;
      else if (t.prazo === hoje) deHoje++;
    });
    var resumo;
    if (!estado.pronto) {
      resumo = "Carregando suas atividades…";
    } else if (abertas === 0) {
      resumo = "Nada em aberto.";
    } else {
      var trechos = ["<b>" + plural(abertas, "atividade aberta", "atividades abertas") + "</b>"];
      if (atrasadas) trechos.push('<span class="vermelho">' + plural(atrasadas, "passou do prazo", "passaram do prazo") + "</span>");
      if (deHoje) trechos.push(deHoje + " para hoje");
      resumo = trechos.join(" · ");
    }
    document.getElementById("resumo").innerHTML = resumo;

    // Filtros por categoria
    var caixaFiltros = document.getElementById("filtros");
    if (categorias.length) {
      var botoes = ['<button type="button" data-filtro="todas" aria-pressed="' + (estado.filtro === "todas") + '">todas</button>'];
      categorias.forEach(function(c){
        botoes.push('<button type="button" data-filtro="' + esc(c) + '" aria-pressed="' + (estado.filtro === c) + '">' + esc(c) + "</button>");
      });
      caixaFiltros.innerHTML = botoes.join("");
      caixaFiltros.hidden = false;
    } else {
      caixaFiltros.innerHTML = "";
      caixaFiltros.hidden = true;
    }

    document.getElementById("listaCategorias").innerHTML =
      categorias.map(function(c){ return '<option value="' + esc(c) + '"></option>'; }).join("");

    desenharResgate();
    desenharAlertas(visiveis, hoje);

    // Corpo
    var html;
    if (!estado.pronto) {
      html = '<div class="vazio"><p class="serif">Abrindo sua agenda…</p></div>';
    } else if (naAgenda) {
      html = desenharAgenda(visiveis, hoje);
      if (!html) {
        html = '<div class="vazio"><p class="serif">' +
          (todas.length ? "Nenhuma atividade nesta categoria." : "A agenda está limpa.") + "</p><p>" +
          (todas.length ? "Troque o filtro acima para ver o resto." : "Escreva a primeira atividade no campo acima e aperte Enter.") +
          "</p></div>";
      }
    } else {
      html = desenharHistorico(visiveis, hoje);
    }
    document.getElementById("listas").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll(".escrita"), crescer);

    // Rodapé
    var modo = document.getElementById("modoArmazenamento");
    if (estado.modo === "nuvem") {
      modo.textContent = "Salvo na sua conta · sincroniza entre dispositivos";
    } else if (estado.modo === "local") {
      modo.innerHTML = "Salvo apenas neste navegador · " +
        '<button type="button" id="tentarNuvem">tentar salvar na conta</button>';
    } else {
      modo.textContent = "Preparando…";
    }
    document.getElementById("totalGeral").textContent =
      todas.length ? plural(todas.length, "atividade no total", "atividades no total") : "";

    estado.assinatura = assinaturaTempo();
    dispararAvisos(hoje);
    restaurarFoco(foco);
  }

  /* ---------------- ações ---------------- */

  // A próxima data do ciclo, nunca no passado: se a série ficou parada,
  // avança até alcançar hoje em vez de nascer já atrasada.
  function proximaData(t){
    var regra = REPETICOES[t.repete];
    if (!regra || !t.prazo) return "";
    var alvo = regra.proxima(t.prazo), hoje = isoHoje(), guarda = 0;
    while (alvo < hoje && guarda++ < 400) alvo = regra.proxima(alvo);
    return alvo;
  }

  function copiar(t, mudancas){
    return normalizar(novoId(), Object.assign({
      titulo: t.titulo, notas: t.notas, prazo: t.prazo, inicio: t.inicio, limite: t.limite,
      categoria: t.categoria, repete: t.repete, serie: "",
      criadaEm: new Date().toISOString()
    }, mudancas || {}));
  }

  // Concluir uma recorrente faz nascer a próxima. Uma série mantém uma única
  // ocorrência aberta por vez, então nada se acumula sozinho.
  function criarProxima(t){
    var data = proximaData(t);
    if (!data) return;
    var serie = t.serie || t.id, pendente = false;
    estado.tarefas.forEach(function(o){
      if (o.id !== t.id && o.status !== "concluida" && (o.serie || o.id) === serie) pendente = true;
    });
    if (pendente) return;
    gravar(copiar(t, { prazo: data, serie: serie }));
  }

  function abrir(id){
    var t = estado.tarefas.get(id);
    estado.aberto = id;
    estado.protegerAberto = true;
    estado.mostrarNota = !!(t && t.notas);
    desenhar();
    var campo = document.getElementById("titulo-" + id);
    if (campo) {
      campo.focus({ preventScroll: true });
      var fim = campo.value.length;
      try { campo.setSelectionRange(fim, fim); } catch (e) { /* ignora */ }
    }
  }

  function fechar(){
    if (!estado.aberto) return;
    estado.aberto = null;
    estado.mostrarNota = false;
    desenhar();
  }

  function adicionar(){
    var campo = document.getElementById("campoNova");
    var campoData = document.getElementById("campoPrazo");
    var recado = document.getElementById("recado");
    var titulo = campo.value.trim();
    if (!titulo) { recado.hidden = true; campo.focus(); return; }

    var prazo = campoData.value || "";
    if (!prazo) {
      recado.textContent = "Toda atividade precisa de um prazo — é ele que diz depois se a entrega saiu no tempo.";
      recado.hidden = false;
      campoData.focus();
      return;
    }
    recado.hidden = true;

    var t = normalizar(novoId(), {
      titulo: titulo,
      prazo: prazo,
      inicio: document.getElementById("campoInicio").value || "",
      limite: document.getElementById("campoLimite").value || "",
      repete: document.getElementById("campoRepete").value || "",
      categoria: estado.filtro === "todas" ? "" : estado.filtro,
      criadaEm: new Date().toISOString()
    });
    gravar(t);
    campo.value = "";
    estado.aberto = null;
    desenhar();
    campo.focus();
  }

  function comTarefa(alvo, fn){
    var art = alvo.closest("article.item");
    if (!art) return;
    var t = estado.tarefas.get(art.getAttribute("data-id"));
    if (t) fn(Object.assign({}, t));
  }

  document.getElementById("abas").addEventListener("click", function(e){
    var b = e.target.closest("button[data-vista]");
    if (!b) return;
    estado.vista = b.getAttribute("data-vista");
    estado.aberto = null;
    estado.verTudo = false;
    gravarPreferencias();
    desenhar();
  });

  document.getElementById("formAdd").addEventListener("submit", function(e){
    e.preventDefault();
    adicionar();
  });

  var campoPrazoNovo = document.getElementById("campoPrazo");
  function sincronizarPrazoNovo(){
    if (campoPrazoNovo.value) document.getElementById("recado").hidden = true;
  }
  campoPrazoNovo.addEventListener("change", sincronizarPrazoNovo);
  campoPrazoNovo.addEventListener("input", sincronizarPrazoNovo);
  // O dia já entra preenchido com hoje: nunca se cria uma atividade sem ele.
  campoPrazoNovo.value = isoHoje();
  document.getElementById("campoRepete").innerHTML = opcoesRepeticao("");

  document.getElementById("filtros").addEventListener("click", function(e){
    var b = e.target.closest("button[data-filtro]");
    if (!b) return;
    estado.filtro = b.getAttribute("data-filtro");
    gravarPreferencias();
    desenhar();
  });

  document.getElementById("faixaResgate").addEventListener("click", function(e){
    var b = e.target.closest("button[data-resgate]");
    if (!b) return;
    if (b.getAttribute("data-resgate") === "importar") importarPresos();
    else descartarPresos();
  });

  document.getElementById("faixaAlertas").addEventListener("click", function(e){
    var b = e.target.closest("button[data-aviso]");
    if (!b) return;
    if (b.getAttribute("data-aviso") === "pedir") pedirAvisos();
    else { estado.avisosNavegador = "dispensado"; desenhar(); }
  });

  document.querySelector(".rodape").addEventListener("click", function(e){
    if (e.target.id === "tentarNuvem") tentarNuvemDeNovo();
  });

  document.getElementById("listas").addEventListener("click", function(e){
    var botao = e.target.closest("button[data-acao]");
    if (!botao) return;
    var acao = botao.getAttribute("data-acao");

    if (acao === "verTudo") {
      estado.verTudo = !estado.verTudo;
      desenhar();
      return;
    }

    if (acao === "verHistorico") {
      var alvoHist = botao.getAttribute("data-id");
      estado.historicoAberto = estado.historicoAberto === alvoHist ? null : alvoHist;
      desenhar();
      return;
    }

    if (acao === "reabrir") {
      var origem = estado.tarefas.get(botao.getAttribute("data-id"));
      if (origem) {
        var volta = Object.assign({}, origem);
        volta.status = "aberta";
        volta.concluidaEm = "";
        gravar(volta);
      }
      estado.historicoAberto = null;
      estado.vista = "agenda";
      gravarPreferencias();
      desenhar();
      return;
    }

    comTarefa(botao, function(t){
      if (acao === "abrir") { abrir(t.id); return; }

      if (acao === "nota") {
        estado.mostrarNota = true;
        desenhar();
        var campo = document.getElementById("notas-" + t.id);
        if (campo) campo.focus({ preventScroll: true });
        return;
      }

      if (acao === "excluir") { remover(t.id); desenhar(); return; }

      if (acao === "duplicar") {
        var copia = copiar(t);
        gravar(copia);
        abrir(copia.id);
        return;
      }

      if (acao === "pular") {
        var adiada = proximaData(t);
        if (adiada) { t.prazo = adiada; gravar(t); }
        desenhar();
        return;
      }

      if (acao === "alternar") {
        if (t.status === "concluida") {
          t.status = "aberta";
          t.concluidaEm = "";
        } else {
          t.status = "concluida";
          t.concluidaEm = new Date().toISOString();
          // Concluir sem nunca ter começado ainda conta como trabalho do dia.
          if (!t.iniciadaEm) t.iniciadaEm = t.concluidaEm;
          if (estado.aberto === t.id) { estado.aberto = null; estado.mostrarNota = false; }
          if (t.repete) {
            t.serie = t.serie || t.id;
            gravar(t);
            criarProxima(t);
            desenhar();
            return;
          }
        }
      } else if (acao === "andamento") {
        if (t.status === "andamento") {
          t.status = "aberta";
        } else {
          t.status = "andamento";
          if (!t.iniciadaEm) t.iniciadaEm = new Date().toISOString();
        }
      }

      gravar(t);
      desenhar();
    });
  });

  document.getElementById("listas").addEventListener("input", function(e){
    var campo = e.target.closest("[data-campo]");
    if (!campo) return;
    var nome = campo.getAttribute("data-campo");
    if (nome !== "titulo" && nome !== "notas") return;
    crescer(campo);
    comTarefa(campo, function(t){
      t[nome] = campo.value;
      estado.tarefas.set(t.id, t);
      adiar(t.id, function(){ gravar(estado.tarefas.get(t.id) || t); });
    });
  });

  document.getElementById("listas").addEventListener("change", function(e){
    var campo = e.target.closest("[data-campo]");
    if (!campo) return;
    var nome = campo.getAttribute("data-campo");
    comTarefa(campo, function(t){
      t[nome] = nome === "categoria" ? campo.value.trim() : campo.value;
      if (nome === "prazo" && !campo.value) { t.inicio = ""; t.limite = ""; }
      gravar(t);
      if (nome !== "titulo" && nome !== "notas") desenhar();
    });
  });

  document.getElementById("listas").addEventListener("keydown", function(e){
    if (e.key === "Escape") { fechar(); return; }
    if (e.key !== "Enter" || e.shiftKey) return;
    // Enter fecha o rascunho; Shift+Enter quebra linha na anotação.
    var campo = e.target.closest('[data-campo="titulo"], [data-campo="categoria"]');
    if (!campo) return;
    e.preventDefault();
    fechar();
  });

  // Clicar fora fecha o rascunho aberto.
  document.addEventListener("click", function(e){
    if (estado.protegerAberto) { estado.protegerAberto = false; return; }
    if (!estado.aberto) return;
    var art = e.target.closest("article.item");
    if (art && art.getAttribute("data-id") === estado.aberto) return;
    fechar();
  });

  window.setInterval(function(){
    if (estado.aberto) return;
    if (assinaturaTempo() !== estado.assinatura) desenhar();
  }, 20000);

  /* ---------------- partida ---------------- */

  document.getElementById("dataHoje").textContent =
    new Intl.DateTimeFormat("pt-BR", { weekday:"long", day:"numeric", month:"long" }).format(new Date());

  estado.avisosNavegador = estadoAvisos();
  lerPreferencias();
  desenhar();
  conectar();
})();
</script>
