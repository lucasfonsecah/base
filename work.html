  function svg(nome, tam){
    return '<svg viewBox="0 0 16 16" aria-hidden="true"' + (tam ? ' width="'+tam+'" height="'+tam+'"' : '') + '>' + IC[nome] + '</svg>';
  }

  /* ======================= desenho: quadro ======================= */

  function etiquetasHtml(c){
    if (!c.etiquetas.length) return "";
    var html = '<div class="etiquetas-cartao">';
    c.etiquetas.forEach(function(id){
      var e = acharEtiqueta(id);
      if (!e) return;
      var titulo = e.nome || "etiqueta";
      html += '<span class="et' + (estado.prefs.textoEtiqueta ? " com-texto" : "") + '" ' +
        'style="--cor:' + hexEtiqueta(e.cor) + '" data-acao="alternar-texto-etiqueta" ' +
        'title="' + esc(titulo) + '">' + (estado.prefs.textoEtiqueta ? esc(e.nome || "") : "") + "</span>";
    });
    return html + "</div>";
  }

  function selosHtml(c){
    var partes = [];
    if (c.repete) partes.push('<span class="selo" title="' + esc(REPETICOES[c.repete].rotulo) + '">' + svg("repete") + "</span>");
    if (c.descricao) partes.push('<span class="selo" title="Este cartão tem uma descrição">' + svg("descricao") + "</span>");

    if (c.prazo || c.inicio) {
      var e = estadoPrazo(c);
      var classe = e === "vencido" ? " vencido" : (e === "logo" ? " logo" : (e === "feito" ? " feito" : ""));
      var texto = rotuloPeriodo(c);
      partes.push('<button type="button" class="selo data' + classe + '" data-acao="alternar-prazo" data-id="' + esc(c.id) + '" ' +
        'title="' + (c.prazoFeito ? "Concluído" : "Marcar como concluído") + '">' +
        svg(c.prazoFeito ? "check" : "relogio") + "<span>" + esc(texto) + "</span></button>");
    }

    var totais = contarChecklist(c);
    if (totais.total) {
      partes.push('<span class="selo' + (totais.feitos === totais.total ? " completa" : "") + '" title="Itens de checklist">' +
        svg("caixa") + "<span>" + totais.feitos + "/" + totais.total + "</span></span>");
    }
    if (c.anexos.length) {
      partes.push('<span class="selo" title="Anexos">' + svg("clipe") + "<span>" + c.anexos.length + "</span></span>");
    }
    if (c.comentarios.length) {
      partes.push('<span class="selo" title="Comentários">' + svg("comentario") + "<span>" + c.comentarios.length + "</span></span>");
    }
    if (c.membros.length) {
      var av = '<span class="membros-cartao">';
      c.membros.forEach(function(id){
        var m = acharMembro(id);
        if (!m) return;
        av += '<span class="av" style="--cor:' + esc(m.cor) + '" title="' + esc(m.nome) + '">' + esc(iniciais(m.nome)) + "</span>";
      });
      partes.push(av + "</span>");
    }
    if (!partes.length) return "";
    return '<div class="selos">' + partes.join("") + "</div>";
  }

  function contarChecklist(c){
    var total = 0, feitos = 0;
    c.checklists.forEach(function(cl){
      cl.itens.forEach(function(it){ total++; if (it.feito) feitos++; });
    });
    return { total:total, feitos:feitos };
  }

  function cartaoHtml(c){
    var capa = null;
    for (var i = 0; i < c.anexos.length; i++) {
      if (ehImagem(c.anexos[i].tipo)) { capa = c.anexos[i]; break; }
    }
    return '<article class="cartao' + (capa ? " com-capa" : "") + '" data-cartao="' + esc(c.id) + '" tabindex="0" role="button" ' +
      'aria-label="' + esc(c.titulo || "cartão sem título") + '">' +
      (capa ? '<span class="capa"><img src="' + esc(capa.src) + '" alt="" loading="lazy"></span>' : "") +
      etiquetasHtml(c) +
      '<span class="titulo-cartao">' + (c.titulo ? esc(c.titulo) : "<em>sem título</em>") + "</span>" +
      selosHtml(c) +
      '<button type="button" class="lapis" data-acao="abrir-cartao" data-id="' + esc(c.id) + '" ' +
      'aria-label="Abrir cartão">' + svg("lapis") + "</button>" +
      "</article>";
  }

  function listaHtml(l){
    var cartoes = cartoesDa(l.id);
    var visiveis = cartoes.filter(passaNoFiltro);
    var html = '<section class="lista" data-lista="' + esc(l.id) + '">';

    if (estado.editandoLista === l.id) {
      html += '<div class="cabeca-lista"><textarea class="edita-nome" data-campo="nome-lista" data-id="' + esc(l.id) + '" ' +
        'rows="1" aria-label="Nome da lista">' + esc(textoDe("nome-lista", l.id, "", l.nome)) + "</textarea></div>";
    } else {
      html += '<div class="cabeca-lista" data-pegar-lista="' + esc(l.id) + '">' +
        '<h2 data-acao="editar-lista" data-id="' + esc(l.id) + '">' + esc(l.nome) + "</h2>" +
        '<span class="n">' + visiveis.length + "</span>" +
        '<button type="button" class="icone-botao" data-acao="menu-lista" data-id="' + esc(l.id) + '" ' +
        'aria-label="Ações da lista">' + svg("pontos") + "</button></div>";
    }

    var compondo = estado.compondoEm === l.id;
    html += '<div class="corpo-lista" data-corpo="' + esc(l.id) + '">';
    if (!visiveis.length && !compondo) {
      html += '<p class="lista-vazia">' + (cartoes.length ? "nenhum cartão passa no filtro" : "sem cartões") + "</p>";
    } else {
      visiveis.forEach(function(c){ html += cartaoHtml(c); });
    }
    // O compositor mora dentro da área que rola: aberto com todos os campos ele
    // é mais alto do que a lista, e por fora transbordava por cima dos cartões.
    if (compondo) html += comporHtml(l);
    html += "</div>";

    if (!compondo) {
      html += '<button type="button" class="add-cartao" data-acao="compor" data-id="' + esc(l.id) + '">' +
        svg("mais", 14) + "Adicionar um cartão</button>";
    }
    return html + "</section>";
  }

  // O compositor é o cartão antes de existir: o título resolve o caso rápido, e
  // "mais detalhes" abre descrição, datas, etiquetas, membros e checklist ali
  // mesmo — assim o cartão já nasce com o que ele diz, em vez de nascer vazio e
  // obrigar a abri-lo em seguida para preencher tudo.
  function comporHtml(l){
    var r = estado.rascunho;
    var html = '<div class="compor">' +
      '<textarea data-campo="novo-cartao" data-id="' + esc(l.id) + '" rows="2" ' +
      'placeholder="Insira um título para este cartão…" aria-label="Título do novo cartão">' + esc(r.titulo) + "</textarea>";

    if (estado.comporDetalhes) {
      html += '<div class="detalhes-compor">';

      html += '<div><p class="mini-titulo">Descrição</p>' +
        '<textarea class="extra" data-campo="r-descricao" rows="2" ' +
        'placeholder="O que precisa ser feito…" aria-label="Descrição">' + esc(r.descricao) + "</textarea></div>";

      html += '<div><p class="mini-titulo">Datas</p><div class="campo-linha">' +
        '<label class="par-data"><span>início</span>' +
        '<input type="date" data-campo="r-inicioDia" value="' + esc(r.inicioDia) + '" aria-label="Dia de início">' +
        '<input type="time" data-campo="r-inicioHora" value="' + esc(r.inicioHora) + '" aria-label="Hora de início"></label>' +
        '<label class="par-data"><span>prazo</span>' +
        '<input type="date" data-campo="r-dia" value="' + esc(r.dia) + '" aria-label="Dia do prazo">' +
        '<input type="time" data-campo="r-hora" value="' + esc(r.hora) + '" aria-label="Hora do prazo"></label>' +
        '<label class="par-data"><span>repete</span><select data-campo="r-repete" aria-label="Repetição">' +
        '<option value="">não</option>';
      Object.keys(REPETICOES).forEach(function(k){
        html += '<option value="' + k + '"' + (r.repete === k ? " selected" : "") + ">" +
          esc(rotuloRepeticao(k, juntar(r.dia || r.inicioDia, ""))) + "</option>";
      });
      html += "</select></label></div></div>";

      if (estado.etiquetas.length) {
        html += '<div><p class="mini-titulo">Etiquetas</p><div class="campo-linha">';
        estado.etiquetas.forEach(function(e){
          var on = r.etiquetas.indexOf(e.id) >= 0;
          html += '<button type="button" class="et alvo' + (e.nome ? " com-texto" : "") + '" ' +
            'style="--cor:' + hexEtiqueta(e.cor) + (e.nome ? "" : ";height:22px;min-width:34px") + '" ' +
            'data-acao="r-etiqueta" data-et="' + esc(e.id) + '" aria-pressed="' + on + '" ' +
            'title="' + esc(e.nome || "etiqueta sem nome") + '">' +
            (on ? "✓" : "") + (e.nome ? (on ? " " : "") + esc(e.nome) : "") + "</button>";
        });
        html += "</div></div>";
      }

      if (estado.membros.length) {
        html += '<div><p class="mini-titulo">Membros</p><div class="campo-linha">';
        estado.membros.forEach(function(m){
          var on = r.membros.indexOf(m.id) >= 0;
          html += '<button type="button" class="av alvo" style="--cor:' + esc(m.cor) + '" ' +
            'data-acao="r-membro" data-m="' + esc(m.id) + '" aria-pressed="' + on + '" ' +
            'title="' + esc(m.nome) + '">' + esc(iniciais(m.nome)) + "</button>";
        });
        html += "</div></div>";
      }

      html += '<div><p class="mini-titulo">Checklist <span style="font-weight:400;opacity:.7">— um item por linha</span></p>' +
        '<textarea class="extra" data-campo="r-itens" rows="2" ' +
        'placeholder="Puxar relatório&#10;Conferir divergências" aria-label="Itens do checklist">' + esc(r.itens) + "</textarea></div>";

      html += "</div>";
    }

    html += '<div class="acoes-compor">' +
      '<button type="button" class="btn" data-acao="salvar-cartao" data-id="' + esc(l.id) + '">Adicionar cartão</button>' +
      '<button type="button" class="icone-botao" data-acao="cancelar-compor" aria-label="Cancelar">' + svg("x") + "</button>" +
      '<button type="button" class="btn fantasma" style="margin-left:auto" data-acao="detalhes-compor">' +
      (estado.comporDetalhes ? "menos detalhes" : "+ detalhes") + "</button>" +
      "</div></div>";
    return html;
  }

  function desenharQuadro(){
    var html = '<div class="quadro" id="quadro">';
    listasVisiveis().forEach(function(l){ html += listaHtml(l); });
    if (estado.novaLista) {
      html += '<div class="caixa-lista">' +
        '<input type="text" data-campo="nova-lista" placeholder="Insira o título da lista" aria-label="Título da lista">' +
        '<div class="acoes-compor">' +
          '<button type="button" class="btn" data-acao="salvar-lista">Adicionar lista</button>' +
          '<button type="button" class="icone-botao" data-acao="cancelar-lista" aria-label="Cancelar">' + svg("x") + "</button>" +
        "</div></div>";
    } else {
      html += '<button type="button" class="add-lista" data-acao="nova-lista">' + svg("mais", 14) +
        (estado.listas.size ? "Adicionar outra lista" : "Adicionar uma lista") + "</button>";
    }
    return html + "</div>";
  }

  /* ======================= desenho: calendário ======================= */

  function desenharCalendario(){
    var mes = estado.mesCal || hoje().slice(0, 7);
    var ano = +mes.slice(0, 4), m = +mes.slice(5, 7) - 1;
    var primeiro = new Date(ano, m, 1);
    var inicio = new Date(ano, m, 1 - primeiro.getDay());

    var porDia = {};
    estado.cartoes.forEach(function(c){
      if (c.arquivado || !passaNoFiltro(c)) return;
      var dia = parteDia(c.prazo || c.inicio);
      if (!dia) return;
      (porDia[dia] = porDia[dia] || []).push(c);
    });

    var html = '<div class="calendario"><div class="cal-topo">' +
      '<button type="button" class="btn-barra" data-acao="mes" data-passo="-1" aria-label="Mês anterior">‹</button>' +
      '<button type="button" class="btn-barra" data-acao="mes" data-passo="0">Hoje</button>' +
      '<button type="button" class="btn-barra" data-acao="mes" data-passo="1" aria-label="Próximo mês">›</button>' +
      "<h2>" + MESES[m].charAt(0).toUpperCase() + MESES[m].slice(1) + " de " + ano + "</h2></div>";

    html += '<div class="cal-grade">';
    DIAS.forEach(function(d){ html += '<div class="cal-dia-nome">' + d + "</div>"; });

    for (var i = 0; i < 42; i++) {
      var d = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + i);
      var iso = isoDia(d);
      var fora = d.getMonth() !== m;
      if (fora && i >= 35) continue;
      var lista = (porDia[iso] || []).sort(function(a, b){
        return (a.prazo || a.inicio) < (b.prazo || b.inicio) ? -1 : 1;
      });
      html += '<div class="cal-cel' + (fora ? " fora" : "") + (iso === hoje() ? " hoje" : "") + '">' +
        '<span class="cal-num">' + d.getDate() + "</span>";
      lista.slice(0, 6).forEach(function(c){
        var cor = c.etiquetas.length ? hexEtiqueta((acharEtiqueta(c.etiquetas[0]) || {}).cor) : "";
        var venc = estadoPrazo(c) === "vencido";
        html += '<button type="button" class="cal-cartao' + (venc ? " vencido" : "") + '" ' +
          'data-acao="abrir-cartao" data-id="' + esc(c.id) + '" ' + (cor ? 'style="--cor:' + cor + '"' : "") + '>' +
          '<span class="pin"></span><span>' + esc(c.titulo || "sem título") + "</span></button>";
      });
      if (lista.length > 6) html += '<span class="cal-num">+' + (lista.length - 6) + " mais</span>";
      html += "</div>";
    }
    return html + "</div></div>";
  }

  /* ======================= desenho: painel ======================= */

  function barrasHtml(linhas){
    if (!linhas.length) return '<p class="vazio-painel">Nada para mostrar ainda.</p>';
    var teto = 1;
    linhas.forEach(function(l){ if (l.valor > teto) teto = l.valor; });
    var html = '<div class="barras">';
    linhas.forEach(function(l){
      var larg = l.valor ? Math.max(4, Math.round(l.valor / teto * 100)) : 0;
      html += '<div class="barra-linha"><span class="rot" title="' + esc(l.rotulo) + '">' + esc(l.rotulo) + "</span>" +
        '<span class="trilho"' + (l.cor ? ' style="--cor:' + l.cor + '"' : "") + '><i style="width:' + larg + '%"></i></span>' +
        '<span class="val">' + l.valor + "</span></div>";
    });
    return html + "</div>";
  }

  function desenharPainel(){
    var ativos = [];
    estado.cartoes.forEach(function(c){ if (!c.arquivado && passaNoFiltro(c)) ativos.push(c); });

    var vencidos = 0, logo = 0, feitos = 0, semPrazo = 0;
    var noPrazo = 0, foraDoPrazo = 0;
    ativos.forEach(function(c){
      var e = estadoPrazo(c);
      if (e === "vencido") vencidos++;
      else if (e === "logo") logo++;
      else if (e === "feito") feitos++;
      if (!c.prazo) semPrazo++;
      if (c.prazoFeito && c.prazo && c.feitoEm) {
        var lim = paraData(c.prazo);
        if (lim) { if (new Date(c.feitoEm).getTime() <= lim.getTime()) noPrazo++; else foraDoPrazo++; }
      }
    });

    var porLista = listasVisiveis().map(function(l){
      return { rotulo: l.nome, valor: ativos.filter(function(c){ return c.lista === l.id; }).length };
    });
    var porMembro = estado.membros.map(function(m){
      return { rotulo: m.nome, cor: m.cor,
               valor: ativos.filter(function(c){ return c.membros.indexOf(m.id) >= 0; }).length };
    }).filter(function(l){ return l.valor; });
    var porEtiqueta = estado.etiquetas.map(function(e){
      return { rotulo: e.nome || "(sem nome)", cor: hexEtiqueta(e.cor),
               valor: ativos.filter(function(c){ return c.etiquetas.indexOf(e.id) >= 0; }).length };
    }).filter(function(l){ return l.valor; });

    var entregas = [];
    if (noPrazo || foraDoPrazo) {
      entregas = [{ rotulo:"No prazo", valor:noPrazo, cor:"#4BCE97" },
                  { rotulo:"Fora do prazo", valor:foraDoPrazo, cor:"#F87168" }];
    }

    var html = '<div class="painel"><div class="cartoes-painel">';
    html += '<div class="caixa-painel"><h3>Como está o quadro</h3><div class="numeros">' +
      numeroHtml(ativos.length, "cartões", "") +
      numeroHtml(vencidos, "vencidos", vencidos ? "ruim" : "") +
      numeroHtml(logo, "vencem em 24h", logo ? "atencao" : "") +
      numeroHtml(feitos, "concluídos", feitos ? "bom" : "") +
      numeroHtml(semPrazo, "sem data", "") +
      "</div></div>";
    html += '<div class="caixa-painel"><h3>Cartões por lista</h3>' + barrasHtml(porLista) + "</div>";
    html += '<div class="caixa-painel"><h3>Cartões por membro</h3>' + barrasHtml(porMembro) + "</div>";
    html += '<div class="caixa-painel"><h3>Cartões por etiqueta</h3>' + barrasHtml(porEtiqueta) + "</div>";
    html += '<div class="caixa-painel"><h3>Entregas com data</h3>' +
      (entregas.length ? barrasHtml(entregas)
        : '<p class="vazio-painel">Marque o prazo de um cartão como concluído para aparecer aqui.</p>') + "</div>";
    return html + "</div></div>";
  }
  function numeroHtml(v, rot, tom){
    return '<div class="numero' + (tom ? " " + tom : "") + '"><b>' + v + "</b><span>" + esc(rot) + "</span></div>";
  }

  /* ======================= desenho: janela do cartão ======================= */

  function janelaHtml(c){
    var lista = estado.listas.get(c.lista);
    var html = '<button type="button" class="fechar-janela" data-acao="fechar-janela" aria-label="Fechar">✕</button>';

    html += '<div class="cabeca-janela"><span class="ic">' + svg("caixa") + "</span>" +
      '<textarea class="titulo-janela" data-campo="titulo" data-id="' + esc(c.id) + '" rows="1" ' +
      'aria-label="Título do cartão">' + esc(c.titulo) + "</textarea></div>";
    html += '<p class="sub-janela">na lista <b>' + esc(lista ? lista.nome : "—") + "</b>" +
      (c.arquivado ? " · <b>arquivado</b>" : "") + "</p>";

    html += '<div class="colunas-janela"><div class="principal">';

    // membros, etiquetas e datas em fileiras
    var fileiras = "";
    if (c.membros.length) {
      var mh = '<div class="fileira">';
      c.membros.forEach(function(id){
        var m = acharMembro(id);
        if (!m) return;
        mh += '<button type="button" class="av g" style="--cor:' + esc(m.cor) + '" data-acao="pop-membros" ' +
          'data-id="' + esc(c.id) + '" title="' + esc(m.nome) + '">' + esc(iniciais(m.nome)) + "</button>";
      });
      mh += '<button type="button" class="add-quadrado" data-acao="pop-membros" data-id="' + esc(c.id) + '" aria-label="Adicionar membro">' + svg("mais", 14) + "</button></div>";
      fileiras += '<div style="margin-right:24px"><p class="mini-titulo">Membros</p>' + mh + "</div>";
    }
    if (c.etiquetas.length) {
      var eh = '<div class="fileira">';
      c.etiquetas.forEach(function(id){
        var e = acharEtiqueta(id);
        if (!e) return;
        eh += '<button type="button" class="et com-texto" style="--cor:' + hexEtiqueta(e.cor) + ';height:32px;display:inline-flex;align-items:center" ' +
          'data-acao="pop-etiquetas" data-id="' + esc(c.id) + '">' + esc(e.nome || " ") + "</button>";
      });
      eh += '<button type="button" class="add-quadrado" data-acao="pop-etiquetas" data-id="' + esc(c.id) + '" aria-label="Adicionar etiqueta">' + svg("mais", 14) + "</button></div>";
      fileiras += '<div style="margin-right:24px"><p class="mini-titulo">Etiquetas</p>' + eh + "</div>";
    }
    if (c.inicio || c.prazo) {
      var e2 = estadoPrazo(c);
      var cls = e2 === "vencido" ? " vencido" : (e2 === "logo" ? " logo" : (e2 === "feito" ? " feito" : ""));
      var rotulo = rotuloPeriodo(c);
      var sufixo = e2 === "vencido" ? " (vencido)" : (e2 === "feito" ? " (concluído)" : (e2 === "logo" ? " (vence logo)" : ""));
      fileiras += '<div><p class="mini-titulo">' + (c.prazo ? "Prazo" : "Início") + "</p>" +
        '<span class="chip-data' + cls + '">' +
        (c.prazo ? '<input type="checkbox" data-acao="alternar-prazo" data-id="' + esc(c.id) + '"' +
          (c.prazoFeito ? " checked" : "") + ' aria-label="Marcar prazo como concluído">' : "") +
        '<button type="button" style="border:0;background:transparent;color:inherit;cursor:pointer;padding:0" ' +
        'data-acao="pop-datas" data-id="' + esc(c.id) + '">' + esc(rotulo + sufixo) + "</button></span></div>";
    }
    if (c.repete) {
      var semAncora = !c.prazo && !c.inicio;
      fileiras += '<div><p class="mini-titulo">Repetição</p>' +
        '<button type="button" class="chip-data' + (semAncora ? " alerta" : "") + '" data-acao="pop-datas" data-id="' + esc(c.id) + '">' +
        svg("repete", 14) + esc(semAncora ? "sem data para repetir" : rotuloRepeticao(c.repete, c.prazo || c.inicio)) +
        "</button></div>";
    }
    if (fileiras) html += '<div class="bloco" style="display:flex;flex-wrap:wrap;gap:12px 0">' + fileiras + "</div>";

    // descrição
    html += '<div class="bloco"><div class="bloco-cabeca"><span class="ic">' + svg("descricao") + "</span>" +
      "<h3>Descrição</h3>" +
      (c.descricao && estado.editor !== "descricao"
        ? '<button type="button" class="btn neutro" data-acao="editar-descricao">Editar</button>' : "") +
      "</div>";
    if (estado.editor === "descricao") {
      html += '<textarea class="editor" data-campo="descricao" data-id="' + esc(c.id) + '" ' +
        'placeholder="Adicione uma descrição mais detalhada…">' + esc(textoDe("descricao", c.id, "", c.descricao)) + "</textarea>" +
        '<div class="acoes-editor"><button type="button" class="btn" data-acao="salvar-descricao" data-id="' + esc(c.id) + '">Salvar</button>' +
        '<button type="button" class="icone-botao" data-acao="cancelar-editor" aria-label="Cancelar">' + svg("x") + "</button></div>";
    } else if (c.descricao) {
      html += '<div class="desc-texto" data-acao="editar-descricao">' + esc(c.descricao) + "</div>";
    } else {
      html += '<button type="button" class="desc-vazia" data-acao="editar-descricao">Adicione uma descrição mais detalhada…</button>';
    }
    html += "</div>";

    // anexos
    if (c.anexos.length || estado.editor === "anexo") {
      html += '<div class="bloco"><div class="bloco-cabeca"><span class="ic">' + svg("clipe") + "</span>" +
        "<h3>Anexos</h3>" +
        '<button type="button" class="btn neutro" data-acao="anexar" data-id="' + esc(c.id) + '">Anexar</button></div>' +
        '<div class="anexos">';
      c.anexos.forEach(function(a){
        html += '<figure class="anexo' + (ehImagem(a.tipo) ? " img" : "") + '">' +
          (ehImagem(a.tipo)
            ? '<a href="' + esc(a.src) + '" target="_blank" rel="noopener"><img src="' + esc(a.src) + '" alt="' + esc(a.nome) + '" loading="lazy"></a>'
            : '<a class="arquivo" href="' + esc(a.src) + '" target="_blank" rel="noopener" download="' + esc(a.nome) + '">' + svg("clipe") + "</a>") +
          '<figcaption><span class="nome" title="' + esc(a.nome) + '">' + esc(a.nome) + "</span>" +
          '<span class="peso">' + esc(formatarTamanho(a.tamanho)) + "</span>" +
          '<button type="button" data-acao="excluir-anexo" data-id="' + esc(c.id) + '" data-anexo="' + esc(a.id) + '">excluir</button>' +
          "</figcaption></figure>";
      });
      html += "</div></div>";
    }

    // checklists
    c.checklists.forEach(function(cl){
      var total = cl.itens.length, feitos = cl.itens.filter(function(i){ return i.feito; }).length;
      var pct = total ? Math.round(feitos / total * 100) : 0;
      html += '<div class="bloco checklist"><div class="bloco-cabeca"><span class="ic">' + svg("caixa") + "</span>" +
        (estado.editor === "nomecl:" + cl.id
          ? '<textarea class="edita-nome" data-campo="nome-checklist" data-id="' + esc(c.id) + '" data-cl="' + esc(cl.id) + '" rows="1" aria-label="Nome do checklist">' + esc(textoDe("nome-checklist", c.id, cl.id, cl.nome)) + "</textarea>"
          : '<h3 style="cursor:pointer" data-acao="renomear-checklist" data-cl="' + esc(cl.id) + '">' + esc(cl.nome) + "</h3>") +
        '<button type="button" class="btn neutro" data-acao="excluir-checklist" data-id="' + esc(c.id) + '" data-cl="' + esc(cl.id) + '">Excluir</button></div>';
      html += '<div class="barra-check"><span class="pct">' + pct + '%</span>' +
        '<span class="trilho-check"><i class="' + (pct === 100 ? "cheio" : "") + '" style="width:' + pct + '%"></i></span></div>';
      cl.itens.forEach(function(it){

  /* ======================= desenho geral ======================= */

  function desenharPilula(){
    var p = document.getElementById("pilulaEstado");
    if (!p) return;
    if (estado.aviso) { p.textContent = estado.aviso; return; }
    if (!estado.pronto) { p.textContent = "Carregando…"; return; }
    var n = 0;
    estado.cartoes.forEach(function(c){ if (!c.arquivado) n++; });
    p.textContent = (estado.modo === "nuvem" ? "Salvo na conta" : "Salvo neste navegador") + " · " + n + " cartões";
  }

  function desenharBarra(){
    var alvo = document.getElementById("membrosBarra");
    alvo.innerHTML = estado.membros.map(function(m){
      var ativo = estado.filtro.membros.indexOf(m.id) >= 0;
      return '<button type="button" class="av" style="--cor:' + esc(m.cor) + (ativo ? ";box-shadow:0 0 0 2px #fff" : "") + '" ' +
        'data-acao="filtrar-membro" data-id="' + esc(m.id) + '" title="' + esc(m.nome) + '">' + esc(iniciais(m.nome)) + "</button>";
    }).join("");

    var guardados = 0;
    estado.cartoes.forEach(function(c){ if (c.arquivado) guardados++; });
    estado.listas.forEach(function(l){ if (l.arquivada) guardados++; });
    document.getElementById("rotuloArquivados").textContent =
      guardados ? "Arquivados · " + guardados : "Arquivados";
    document.getElementById("btArquivados").classList.toggle("ativo", guardados > 0);

    var n = contarFiltros();
    document.getElementById("rotuloFiltro").textContent = n ? "Filtro · " + n : "Filtro";
    document.getElementById("btFiltro").classList.toggle("ativo", n > 0);

    Array.prototype.forEach.call(document.querySelectorAll("#vistas button"), function(b){
      b.setAttribute("aria-selected", String(b.getAttribute("data-vista") === estado.vista));
    });
  }

  function desenhar(){
    var app = document.getElementById("app");
    app.style.setProperty("--fundo", estado.prefs.fundo);
    if (estado.prefs.tema) document.documentElement.setAttribute("data-tema", estado.prefs.tema);
    else document.documentElement.removeAttribute("data-tema");

    desenharBarra();
    desenharPilula();

    var foco = document.activeElement;
    var chaveFoco = foco && foco.getAttribute ? (foco.getAttribute("data-campo") || "") : "";
    var idFoco = foco && foco.getAttribute ? (foco.getAttribute("data-id") || "") : "";
    var selIni = foco && foco.selectionStart;
    var selFim = foco && foco.selectionEnd;
    var rolagem = {};
    Array.prototype.forEach.call(document.querySelectorAll("[data-corpo]"), function(el){
      rolagem[el.getAttribute("data-corpo")] = el.scrollTop;
    });
    var rolagemH = 0;
    var q = document.getElementById("quadro");
    if (q) rolagemH = q.scrollLeft;

    var palco = document.getElementById("palco");
    if (!estado.pronto) {
      palco.innerHTML = '<div class="painel"><p style="color:#fff">Abrindo o quadro…</p></div>';
    } else if (estado.vista === "calendario") {
      palco.innerHTML = desenharCalendario();
    } else if (estado.vista === "painel") {
      palco.innerHTML = desenharPainel();
    } else {
      palco.innerHTML = desenharQuadro();
    }

    Array.prototype.forEach.call(document.querySelectorAll("[data-corpo]"), function(el){
      var v = rolagem[el.getAttribute("data-corpo")];
      if (v) el.scrollTop = v;
    });
    q = document.getElementById("quadro");
    if (q && rolagemH) q.scrollLeft = rolagemH;

    var veu = document.getElementById("veu");
    if (estado.cartaoAberto && estado.cartoes.has(estado.cartaoAberto)) {
      document.getElementById("janela").innerHTML = janelaHtml(estado.cartoes.get(estado.cartaoAberto));
      veu.hidden = false;
      Array.prototype.forEach.call(document.querySelectorAll(".janela textarea"), crescer);
    } else {
      veu.hidden = true;
      estado.cartaoAberto = null;
    }

    if (chaveFoco) {
      var sel = '[data-campo="' + chaveFoco + '"]' + (idFoco ? '[data-id="' + idFoco + '"]' : "");
      var novo = document.querySelector(sel);
      if (novo && novo !== document.activeElement) {
        novo.focus();
        try { if (selIni != null) novo.setSelectionRange(selIni, selFim); } catch (e) {}
      }
    }
    Array.prototype.forEach.call(document.querySelectorAll(".edita-nome,.compor textarea"), crescer);
  }

  function chaveTexto(campo, id, cl){ return campo + ":" + (id || "") + ":" + (cl || ""); }
  function textoDe(campo, id, cl, gravado){
    var k = chaveTexto(campo, id, cl);

  function crescer(el){
    if (!el || el.tagName !== "TEXTAREA") return;
    el.style.height = "auto";

  }

  var popAlvo = null;
  function abrirPop(ancora, titulo, html, depois){
    var pop = document.getElementById("pop");
    pop.innerHTML = '<div class="pop-cabeca"><span>' + esc(titulo) + "</span>" +
      '<button type="button" class="pop-x" data-acao="fechar-pop" aria-label="Fechar">✕</button></div>' + html;
    pop.hidden = false;
    popAlvo = ancora;
    posicionarPop(ancora);
    if (depois) depois(pop);
  }
  function posicionarPop(ancora){
    var pop = document.getElementById("pop");
    var r = ancora && ancora.getBoundingClientRect ? ancora.getBoundingClientRect() : { left:20, bottom:60, top:60 };
    var largura = pop.offsetWidth, altura = pop.offsetHeight;
    var x = Math.min(Math.max(8, r.left), window.innerWidth - largura - 8);
    var y = r.bottom + 6;
    if (y + altura > window.innerHeight - 8) y = Math.max(8, r.top - altura - 6);
    pop.style.left = x + "px";
    pop.style.top = y + "px";
  }
  function fecharPop(){
    var pop = document.getElementById("pop");
    pop.hidden = true;
    pop.innerHTML = "";
    popAlvo = null;
  }

  // Mudou a data no popover? Os rótulos da repetição têm de acompanhar na hora,
  // senão o seletor fica dizendo o dia da semana que a data tinha antes.
  function atualizarRepeticao(){
    var sel = document.getElementById("rep");
    if (!sel) return;
    var di = document.getElementById("dIni"), df = document.getElementById("dFim");
    var base = (df && df.value) || (di && di.value) || "";
    var atual = sel.value;
    var html = '<option value="">Não repete</option>';
    Object.keys(REPETICOES).forEach(function(k){
      html += '<option value="' + k + '">' + esc(rotuloRepeticao(k, base)) + "</option>";
    });
    sel.innerHTML = html;
    sel.value = atual;
    var aviso = document.querySelector("#pop .aviso-pop");
    if (aviso) {
      aviso.innerHTML = (base
        ? "A repetição segue o dia do prazo: com o prazo numa terça, repete toda terça. Para mudar o dia, mude a data."
        : "<b>Preencha o prazo primeiro.</b> A repetição precisa de uma data para saber em que dia cair.") +
        " Ao marcar o prazo como concluído, a próxima volta nasce na primeira lista.";
    }
  }

  /* ======================= gaveta ======================= */

  /* ======================= ações ======================= */

  function cartao(id){ return estado.cartoes.get(id); }

  function criarCartao(idLista, titulo, noTopo){
    var lista = cartoesDa(idLista);
    var ordem = noTopo
      ? ordemEntre(null, lista.length ? lista[0].ordem : null)
      : ordemEntre(lista.length ? lista[lista.length-1].ordem : null, null);
    var c = normalizarCartao(novoId(), { lista:idLista, ordem:ordem, titulo:titulo, criadoEm:agora() });
    anotar(c, "cartão criado");
    gravarCartao(c);
    return c;
  }

  // O cartão nasce já com o que foi escrito no compositor.
  function criarCartaoDoRascunho(idLista, titulo){
    var r = estado.rascunho;
    var lista = cartoesDa(idLista);
    var itens = r.itens.split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
    var c = normalizarCartao(novoId(), {
      lista: idLista,
      ordem: ordemEntre(lista.length ? lista[lista.length-1].ordem : null, null),
      titulo: titulo,
      descricao: r.descricao.trim(),
      inicio: juntar(r.inicioDia, r.inicioHora),
      prazo: juntar(r.dia, r.hora),
      repete: r.repete,
      etiquetas: r.etiquetas.slice(),
      membros: r.membros.slice(),
      checklists: itens.length ? [{ id: novoId(), nome: "Checklist",
        itens: itens.map(function(t){ return { id: novoId(), texto: t, feito: false }; }) }] : [],
      criadoEm: agora()
    });
    anotar(c, "cartão criado");
    gravarCartao(c);
    return c;
  }

  function moverCartao(c, idLista, ordem){
    var antes = c.lista;
    c.lista = idLista;
    c.ordem = ordem;
    if (antes !== idLista) {
      var la = estado.listas.get(antes), lb = estado.listas.get(idLista);
      anotar(c, "moveu de " + (la ? la.nome : "?") + " para " + (lb ? lb.nome : "?"));
    }
    gravarCartao(c);
  }

  function alternarPrazo(c){
    c.prazoFeito = !c.prazoFeito;
    c.feitoEm = c.prazoFeito ? agora() : "";
    anotar(c, c.prazoFeito ? "marcou o prazo como concluído" : "reabriu o prazo");
    if (c.prazoFeito && c.repete) nascerDeNovo(c);
    gravarCartao(c);
  }

  // Um cartão que se repete não some ao ser concluído: a próxima volta nasce
  // na primeira lista, com as datas adiantadas e os checklists zerados.
  function nascerDeNovo(c){
    var regra = REPETICOES[c.repete];
    var base = parteDia(c.prazo || c.inicio);
    if (!regra || !base) return;
    var proximo = regra.passo(base), guarda = 0;
    while (proximo < hoje() && guarda++ < 60) proximo = regra.passo(proximo);
    var delta = diffDias(base, proximo);

    var primeira = listasVisiveis()[0];
    var alvo = primeira ? primeira.id : c.lista;
    var lista = cartoesDa(alvo);
    var novo = normalizarCartao(novoId(), Object.assign({}, corpoCartao(c), {
      lista: alvo,
      ordem: ordemEntre(lista.length ? lista[lista.length-1].ordem : null, null),
      prazo: c.prazo ? juntar(somarDias(parteDia(c.prazo), delta), parteHora(c.prazo)) : "",
      inicio: c.inicio ? juntar(somarDias(parteDia(c.inicio), delta), parteHora(c.inicio)) : "",
      prazoFeito: false,
      feitoEm: "",
      comentarios: [],
      atividade: [],
      criadoEm: agora(),
      checklists: c.checklists.map(function(cl){
        return { id: novoId(), nome: cl.nome,
                 itens: cl.itens.map(function(i){ return { id: novoId(), texto: i.texto, feito: false }; }) };
      })
    }));
    anotar(novo, "próxima volta de um cartão que se repete");
    gravarCartao(novo, true);
  }
  function diffDias(a, b){
    var pa = a.split("-"), pb = b.split("-");
    var da = new Date(+pa[0], +pa[1]-1, +pa[2]), dbb = new Date(+pb[0], +pb[1]-1, +pb[2]);
    return Math.round((dbb - da) / 86400000);
  }

  function arquivarCartao(c, valor){
    c.arquivado = valor;
    anotar(c, valor ? "arquivou o cartão" : "enviou de volta ao quadro");
    if (valor && estado.cartaoAberto === c.id) estado.cartaoAberto = null;
    gravarCartao(c);
    if (valor) {
      oferecerDesfazer("\u201c" + (c.titulo || "cartão sem título") + "\u201d foi para os arquivados.", function(){
        arquivarCartao(c, false);
      });
    }
  }

  // Arquivar some com o cartão da tela. Sem um caminho de volta à mão, a pessoa
  // fica procurando onde ele foi parar — foi exatamente o que aconteceu.
  var relogioTorrada = null;
  function oferecerDesfazer(texto, acao){
    var t = document.getElementById("torrada");
    t.innerHTML = '<span>' + esc(texto) + "</span>" +
      '<button type="button" data-acao="desfazer-torrada">desfazer</button>' +
      '<button type="button" data-acao="ver-arquivados">ver arquivados</button>';
    t.hidden = false;
    estado.desfazer = acao;
    if (relogioTorrada) window.clearTimeout(relogioTorrada);
    relogioTorrada = window.setTimeout(fecharTorrada, 9000);
  }
  function fecharTorrada(){
    document.getElementById("torrada").hidden = true;
    estado.desfazer = null;
    if (relogioTorrada) { window.clearTimeout(relogioTorrada); relogioTorrada = null; }
  }

  function copiarCartao(c){
    var lista = cartoesDa(c.lista);
    var novo = normalizarCartao(novoId(), Object.assign({}, corpoCartao(c), {
      titulo: c.titulo + " (cópia)",
      ordem: ordemEntre(c.ordem, lista.length ? proximaOrdem(lista, c) : null),
      comentarios: [], atividade: [], criadoEm: agora(),
      checklists: c.checklists.map(function(cl){
        return { id: novoId(), nome: cl.nome, itens: cl.itens.map(function(i){
          return { id: novoId(), texto: i.texto, feito: i.feito }; }) };
      })
    }));
    anotar(novo, "copiado de " + (c.titulo || "outro cartão"));
    gravarCartao(novo);
    estado.cartaoAberto = novo.id;
    desenhar();
  }
  function proximaOrdem(lista, c){
    for (var i = 0; i < lista.length; i++) if (lista[i].id === c.id) return lista[i+1] ? lista[i+1].ordem : null;
    return null;
  }

  /* ======================= arrastar ======================= */

  var arrasto = null;
  var suprimirClique = false;   // o clique que encerra um arraste não abre o cartão

  function iniciarArrasto(ev, el, tipo){
    var r = el.getBoundingClientRect();
    arrasto = {
      tipo: tipo,
      id: el.getAttribute(tipo === "cartao" ? "data-cartao" : "data-lista"),
      el: el,
      dx: ev.clientX - r.left,
      dy: ev.clientY - r.top,
      largura: r.width,
      altura: r.height,
      x0: ev.clientX,
      y0: ev.clientY,
      ativo: false,
      clone: null,
      vaga: null
    };
    document.addEventListener("pointermove", moverArrasto);
    document.addEventListener("pointerup", soltarArrasto);
    document.addEventListener("pointercancel", soltarArrasto);
  }

  function ativarArrasto(){
    var a = arrasto;
    a.ativo = true;
    var clone = a.el.cloneNode(true);
    clone.classList.add("voando");
    clone.style.width = a.largura + "px";
    clone.style.left = (a.x0 - a.dx) + "px";
    clone.style.top = (a.y0 - a.dy) + "px";
    document.body.appendChild(clone);
    a.clone = clone;

    var vaga = document.createElement("div");
    vaga.className = "vaga";
    vaga.style.height = a.altura + "px";
    if (a.tipo === "lista") { vaga.style.width = a.largura + "px"; vaga.style.flex = "0 0 " + a.largura + "px"; }
    a.vaga = vaga;
    a.el.parentNode.insertBefore(vaga, a.el);
    a.el.classList.add(a.tipo === "cartao" ? "fantasma" : "arrastando-lista");
    a.el.style.display = "none";
    document.body.style.userSelect = "none";
  }

  function moverArrasto(ev){
    var a = arrasto;
    if (!a) return;
    if (!a.ativo) {
      if (Math.abs(ev.clientX - a.x0) + Math.abs(ev.clientY - a.y0) < 6) return;
      ativarArrasto();
    }
    ev.preventDefault();
    a.clone.style.left = (ev.clientX - a.dx) + "px";
    a.clone.style.top = (ev.clientY - a.dy) + "px";

    // rolagem automática perto das bordas do quadro
    var quadro = document.getElementById("quadro");
    if (quadro) {
      var r = quadro.getBoundingClientRect();
      if (ev.clientX > r.right - 70) quadro.scrollLeft += 14;
      else if (ev.clientX < r.left + 70) quadro.scrollLeft -= 14;
    }

    if (a.tipo === "cartao") posicionarVagaCartao(ev);
    else posicionarVagaLista(ev);
  }

  function posicionarVagaCartao(ev){
    var a = arrasto;
    var el = document.elementFromPoint(ev.clientX, ev.clientY);
    var corpo = el && el.closest ? el.closest(".corpo-lista") : null;
    if (!corpo) {
      var lista = el && el.closest ? el.closest(".lista") : null;
      corpo = lista ? lista.querySelector(".corpo-lista") : null;
    }
    if (!corpo) return;
    var cartoes = Array.prototype.filter.call(corpo.children, function(x){
      return x.classList.contains("cartao") && x !== a.el;
    });
    var antes = null;
    for (var i = 0; i < cartoes.length; i++) {
      var r = cartoes[i].getBoundingClientRect();
      if (ev.clientY < r.top + r.height / 2) { antes = cartoes[i]; break; }
    }
    var vazio = corpo.querySelector(".lista-vazia");
    if (vazio) vazio.remove();
    corpo.insertBefore(a.vaga, antes);
  }

  function posicionarVagaLista(ev){
    var a = arrasto;
    var quadro = document.getElementById("quadro");
    if (!quadro) return;
    var listas = Array.prototype.filter.call(quadro.children, function(x){
      return x.classList.contains("lista") && x !== a.el;
    });
    var antes = null;
    for (var i = 0; i < listas.length; i++) {
      var r = listas[i].getBoundingClientRect();
      if (ev.clientX < r.left + r.width / 2) { antes = listas[i]; break; }
    }
    quadro.insertBefore(a.vaga, antes);
  }

  function soltarArrasto(){
    var a = arrasto;
    document.removeEventListener("pointermove", moverArrasto);
    document.removeEventListener("pointerup", soltarArrasto);
    document.removeEventListener("pointercancel", soltarArrasto);
    arrasto = null;
    if (!a) return;
    document.body.style.userSelect = "";
    if (!a.ativo) return;
    suprimirClique = true;
    window.setTimeout(function(){ suprimirClique = false; }, 0);

    if (a.clone) a.clone.remove();
    a.el.style.display = "";
    a.el.classList.remove("fantasma", "arrastando-lista");

    var vaga = a.vaga;
    var pai = vaga.parentNode;
    if (!pai) { desenhar(); return; }

    if (a.tipo === "cartao") {
      var idLista = pai.getAttribute("data-corpo");
      var irmaos = Array.prototype.filter.call(pai.children, function(x){
        return x.classList.contains("cartao") || x === vaga;
      });
      var pos = irmaos.indexOf(vaga);
      var antes = pos > 0 ? estado.cartoes.get(irmaos[pos-1].getAttribute("data-cartao")) : null;
      var depois = pos < irmaos.length - 1 ? estado.cartoes.get(irmaos[pos+1].getAttribute("data-cartao")) : null;
      vaga.remove();
      var c = estado.cartoes.get(a.id);
      if (c && idLista) moverCartao(c, idLista, ordemEntre(antes ? antes.ordem : null, depois ? depois.ordem : null));
      else desenhar();
    } else {
      var irmas = Array.prototype.filter.call(pai.children, function(x){
        return x.classList.contains("lista") || x === vaga;
      });
      var p2 = irmas.indexOf(vaga);
      var la = p2 > 0 ? estado.listas.get(irmas[p2-1].getAttribute("data-lista")) : null;
      var lb = p2 < irmas.length - 1 ? estado.listas.get(irmas[p2+1].getAttribute("data-lista")) : null;
      vaga.remove();
      var l = estado.listas.get(a.id);
      if (l) { l.ordem = ordemEntre(la ? la.ordem : null, lb ? lb.ordem : null); gravarQuadro(); }
      else desenhar();
    }
  }

  document.addEventListener("pointerdown", function(ev){
    if (ev.button !== 0) return;
    if (estado.vista !== "quadro") return;
    var alvo = ev.target;
    if (alvo.closest("button") || alvo.closest("input") || alvo.closest("textarea")) return;

    var cartaoEl = alvo.closest(".cartao");
    if (cartaoEl) { iniciarArrasto(ev, cartaoEl, "cartao"); return; }

    var cabeca = alvo.closest("[data-pegar-lista]");
    if (cabeca && !alvo.closest("h2")) {
      var listaEl = cabeca.closest(".lista");
      if (listaEl) iniciarArrasto(ev, listaEl, "lista");
    }
  });

  /* ======================= eventos ======================= */

  function fecharTudo(){
    fecharPop();
    document.getElementById("gaveta").hidden = true;
  }

  document.addEventListener("click", function(ev){
    var el = ev.target.closest("[data-acao]");

    // clique fora fecha popover e gaveta
    if (!el || ["fechar-pop"].indexOf(el.getAttribute("data-acao")) >= 0) {
      var pop = document.getElementById("pop");
      if (!pop.hidden && (!ev.target.closest("#pop") || (el && el.getAttribute("data-acao") === "fechar-pop"))) fecharPop();
      var g = document.getElementById("gaveta");
      if (!g.hidden && !ev.target.closest(".gaveta") && !(el && el.getAttribute("data-acao") === "abrir-gaveta")) g.hidden = true;
    }
    if (!el) {
      // clicar no cartão (fora dos botões) abre a janela
      var c0 = ev.target.closest(".cartao");
      if (c0 && !arrasto && !suprimirClique) { estado.cartaoAberto = c0.getAttribute("data-cartao"); estado.editor = null; estado.anexosDoComentario = []; esquecerTextos(); desenhar(); return; }
      if (ev.target.id === "veu") { estado.cartaoAberto = null; estado.editor = null; esquecerTextos(); desenhar(); }
      return;
    }

    if (suprimirClique) return;
    var acao = el.getAttribute("data-acao");
    var id = el.getAttribute("data-id") || "";
    var c = cartao(id);

    switch (acao) {
      case "ir-quadro": estado.vista = "quadro"; gravarPrefs(); desenhar(); break;
      case "abrir-gaveta": abrirGaveta(); break;
      case "abrir-arquivados": abrirGaveta(true); break;
      case "ver-arquivados": fecharTorrada(); abrirGaveta(true); break;
      case "desfazer-torrada": {
        var acaoDesfazer = estado.desfazer;
        fecharTorrada();
        if (acaoDesfazer) acaoDesfazer();
        break;
      }
      case "fechar-gaveta": document.getElementById("gaveta").hidden = true; break;
      case "fechar-pop": fecharPop(); break;

      case "compor":
        estado.compondoEm = id; estado.rascunho = rascunhoVazio(); desenhar();
        var t = document.querySelector('[data-campo="novo-cartao"]');
        if (t) { t.focus(); var cx = t.closest(".compor"); if (cx) cx.scrollIntoView({ block:"nearest" }); }
        break;
      case "cancelar-compor": estado.compondoEm = null; estado.rascunho = rascunhoVazio(); desenhar(); break;
      case "salvar-cartao": {
        var campo = document.querySelector('[data-campo="novo-cartao"][data-id="' + id + '"]');
        var txt = (campo ? campo.value : estado.rascunho.titulo).trim();
        if (!txt) { estado.compondoEm = null; estado.rascunho = rascunhoVazio(); desenhar(); break; }
        criarCartaoDoRascunho(id, txt);
        estado.rascunho = rascunhoVazio();
        estado.compondoEm = id;
        desenhar();
        var t2 = document.querySelector('[data-campo="novo-cartao"]');
        if (t2) t2.focus();
        break;
      }
      case "detalhes-compor":
        estado.comporDetalhes = !estado.comporDetalhes;
        gravarPrefs();
        desenhar();
        break;
      case "r-etiqueta": {
        var idEtR = el.getAttribute("data-et");
        var pr = estado.rascunho.etiquetas.indexOf(idEtR);
        if (pr >= 0) estado.rascunho.etiquetas.splice(pr, 1); else estado.rascunho.etiquetas.push(idEtR);
        desenhar();
        break;
      }
      case "r-membro": {
        var idMR = el.getAttribute("data-m");
        var pm2 = estado.rascunho.membros.indexOf(idMR);

  document.getElementById("vistas").addEventListener("click", function(ev){

    var c = alvo ? cartao(alvo.id) : null;
    if (c && ev.target.files && ev.target.files.length) anexarAo(c, ev.target.files, alvo.comentario);
    estado.alvoAnexo = null;
    ev.target.value = "";
  });

  // Colar um print com a janela do cartão aberta anexa nele. Se o cursor estiver
  // na caixa de comentário, a imagem sai junto com o comentário.
  document.addEventListener("paste", function(ev){
    if (!estado.cartaoAberto) return;
    var dados = ev.clipboardData;
    if (!dados || !dados.items) return;
    var arquivos = [];
    Array.prototype.forEach.call(dados.items, function(item){
      if (item.kind !== "file") return;
      var f = item.getAsFile();
      if (f) arquivos.push(f);
    });
    if (!arquivos.length) return;
    ev.preventDefault();
    var noComentario = document.activeElement
      && document.activeElement.getAttribute
      && document.activeElement.getAttribute("data-campo") === "comentario";
    anexarAo(cartao(estado.cartaoAberto), arquivos, noComentario);
  });

  // Arrastar um arquivo para dentro da janela do cartão também anexa.
  (function(){
    var veu = document.getElementById("veu");
    ["dragenter", "dragover"].forEach(function(nome){
      veu.addEventListener(nome, function(ev){
        if (!estado.cartaoAberto || !ev.dataTransfer || ev.dataTransfer.types.indexOf("Files") < 0) return;
        ev.preventDefault();
        veu.classList.add("recebendo");
      });
    });
    ["dragleave", "dragend"].forEach(function(nome){
      veu.addEventListener(nome, function(ev){
        if (ev.target === veu) veu.classList.remove("recebendo");
      });
    });
    veu.addEventListener("drop", function(ev){
      veu.classList.remove("recebendo");
      if (!estado.cartaoAberto || !ev.dataTransfer || !ev.dataTransfer.files.length) return;
      ev.preventDefault();
      anexarAo(cartao(estado.cartaoAberto), ev.dataTransfer.files, false);
    });
  })();

  });

  // digitação nos campos que vivem dentro do desenho
  document.addEventListener("input", function(ev){
    var campo = ev.target.getAttribute && ev.target.getAttribute("data-campo");
    if (!campo) return;
    crescer(ev.target);
    var id = ev.target.getAttribute("data-id");
    if (campo === "titulo") {
      var c = cartao(id);
      if (!c) return;
      c.titulo = ev.target.value;
      adiar("titulo" + id, function(){ gravarCartao(c, true); });
    }
    if (CAMPOS_GUARDADOS[campo]) {
      estado.textos[chaveTexto(campo, ev.target.getAttribute("data-id"), ev.target.getAttribute("data-cl"))] = ev.target.value;
    }
    if (campo === "novo-cartao") estado.rascunho.titulo = ev.target.value;
    if (campo === "r-dia" || campo === "r-inicioDia") adiar("repeticao", desenhar);
    if (campo.slice(0, 2) === "r-") {
      var chave = campo.slice(2);
      if (estado.rascunho[chave] !== undefined) estado.rascunho[chave] = ev.target.value;
    }
    if (campo === "fTexto") {
      estado.filtro.texto = ev.target.value.trim();
      adiar("busca", desenhar);
    }
  });

  // Os campos cujo texto precisa sobreviver a um redesenho.
  var CAMPOS_GUARDADOS = {
    "descricao": 1, "comentario": 1, "novo-item": 1, "nome-lista": 1, "nome-checklist": 1
  };

  document.addEventListener("input", function(ev){
    if (ev.target.id === "dFim" || ev.target.id === "dIni") atualizarRepeticao();
  });

  document.addEventListener("change", function(ev){
    if (ev.target.id === "dFim" || ev.target.id === "dIni") atualizarRepeticao();
    var campoR = ev.target.getAttribute && ev.target.getAttribute("data-campo");
    if (campoR && campoR.slice(0, 2) === "r-") {
      var ch = campoR.slice(2);
      if (estado.rascunho[ch] !== undefined) estado.rascunho[ch] = ev.target.value;
    }
    var acao = ev.target.getAttribute && ev.target.getAttribute("data-acao");
    if (acao !== "item-check") return;
    var c = cartao(ev.target.getAttribute("data-id"));
    if (!c) return;
    var idCl = ev.target.getAttribute("data-cl"), idIt = ev.target.getAttribute("data-item");
    c.checklists.forEach(function(cl){
      if (cl.id !== idCl) return;
      cl.itens.forEach(function(it){ if (it.id === idIt) it.feito = ev.target.checked; });
    });
    gravarCartao(c);
  });

  // confirmar/cancelar nos campos de texto
  document.addEventListener("keydown", function(ev){
    var campo = ev.target.getAttribute && ev.target.getAttribute("data-campo");

    if (ev.key === "Escape") {
      if (!document.getElementById("pop").hidden) { fecharPop(); return; }
      if (!document.getElementById("gaveta").hidden) { document.getElementById("gaveta").hidden = true; return; }
      if (estado.editor) { estado.editor = null; esquecerTextos(); desenhar(); return; }
      if (estado.compondoEm) { estado.compondoEm = null; estado.rascunho = rascunhoVazio(); desenhar(); return; }
      if (estado.novaLista) { estado.novaLista = false; desenhar(); return; }
      if (estado.editandoLista) { estado.editandoLista = null; desenhar(); return; }
      if (estado.cartaoAberto) { estado.cartaoAberto = null; esquecerTextos(); desenhar(); return; }
      return;
    }

    if (!campo) return;

    if (campo === "novo-cartao" && ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      var b = document.querySelector('[data-acao="salvar-cartao"][data-id="' + ev.target.getAttribute("data-id") + '"]');
      if (b) b.click();
      return;
    }
    if (campo === "nova-lista" && ev.key === "Enter") {
      ev.preventDefault();
      var b2 = document.querySelector('[data-acao="salvar-lista"]');
      if (b2) b2.click();
      return;
    }
    if ((campo === "nome-lista" || campo === "nome-checklist") && ev.key === "Enter") { ev.preventDefault(); ev.target.blur(); return; }
    if (campo === "titulo" && ev.key === "Enter") { ev.preventDefault(); ev.target.blur(); return; }
    if (campo === "novo-item" && ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      var b3 = document.querySelector('[data-acao="salvar-item"][data-cl="' + ev.target.getAttribute("data-cl") + '"]');
      if (b3) b3.click();
      return;
    }
    if (campo === "comentario" && ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      var b4 = document.querySelector('[data-acao="salvar-comentario"]');
      if (b4) b4.click();
      return;
    }
    if (campo === "descricao" && ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) {
      ev.preventDefault();
      var b5 = document.querySelector('[data-acao="salvar-descricao"]');
      if (b5) b5.click();
    }
  });

  document.addEventListener("focusout", function(ev){
    var campo = ev.target.getAttribute && ev.target.getAttribute("data-campo");
    if (campo === "nome-checklist") {
      var cc = cartao(ev.target.getAttribute("data-id"));
      var idCl = ev.target.getAttribute("data-cl");
      var nomeCl = ev.target.value.trim();
      estado.editor = null;
      esquecerTexto("nome-checklist", ev.target.getAttribute("data-id"), idCl);
      if (cc && nomeCl) {
        cc.checklists.forEach(function(cl){ if (cl.id === idCl) cl.nome = nomeCl; });
        gravarCartao(cc);
      } else desenhar();
    }
    if (campo === "nome-lista") {
      var l = estado.listas.get(ev.target.getAttribute("data-id"));
      var nome = ev.target.value.trim();
      estado.editandoLista = null;
      esquecerTexto("nome-lista", ev.target.getAttribute("data-id"), "");
      if (l && nome && nome !== l.nome) { l.nome = nome; gravarQuadro(); }
      else desenhar();
    }
    if (campo === "titulo") {
      var c = cartao(ev.target.getAttribute("data-id"));
      if (c) gravarCartao(c, true);
    }
  });

  window.addEventListener("resize", function(){
    if (!document.getElementById("pop").hidden && popAlvo) posicionarPop(popAlvo);
  });

  /* ======================= partida ======================= */

  lerPrefs();
  estado.mesCal = hoje().slice(0, 7);
  desenhar();
  conectar();

  // o quadro envelhece sozinho: prazos viram "vence logo" e depois "vencido"
  // O relógio existe só para envelhecer os prazos ("vence logo" vira "vencido").
  // Ele nunca pode interromper quem está no meio de alguma coisa: com um cartão
  // aberto, um campo em foco ou um popover na tela, ele espera a vez.
  window.setInterval(function(){
    if (estado.vista !== "quadro" && estado.vista !== "calendario") return;
    if (estado.cartaoAberto || estado.compondoEm || estado.editor ||
        estado.editandoLista || estado.novaLista) return;
    if (!document.getElementById("pop").hidden) return;
    if (!document.getElementById("gaveta").hidden) return;
    var foco = document.activeElement;
    if (foco && (foco.tagName === "TEXTAREA" || foco.tagName === "INPUT" ||
                 foco.isContentEditable)) return;
    desenhar();
  }, 60000);
})();
</script>
