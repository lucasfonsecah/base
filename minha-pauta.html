<title>Minha Pauta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --papel:#F4F5F2;
  --superficie:#FFFFFF;
  --recuo:#EDEFE9;
  --tinta:#1B1F2A;
  --tinta-suave:#5E6673;
  --tinta-fraca:#8A919C;
  --linha:#E1E4DD;
  --linha-forte:#C7CCC2;
  --acento:#2F6F5E;
  --acento-tinta:#255A4C;
  --acento-fundo:#E3EFE9;
  --atraso:#A63B28;
  --andamento:#8C6110;
  --andamento-fundo:#F6EEDC;
  --sombra:0 1px 1px rgba(27,31,42,.04), 0 10px 26px -20px rgba(27,31,42,.45);
  --raio:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#12151A;
    --superficie:#1A1E24;
    --recuo:#232830;
    --tinta:#E9ECE6;
    --tinta-suave:#99A1AC;
    --tinta-fraca:#79818D;
    --linha:#2A3039;
    --linha-forte:#3C4450;
    --acento:#6FB59A;
    --acento-tinta:#8FCBB3;
    --acento-fundo:#1B2E29;
    --atraso:#E9925A;
    --andamento:#D6AC61;
    --andamento-fundo:#2E2617;
    --sombra:0 1px 1px rgba(0,0,0,.3), 0 10px 26px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --papel:#12151A;
  --superficie:#1A1E24;
  --recuo:#232830;
  --tinta:#E9ECE6;
  --tinta-suave:#99A1AC;
  --tinta-fraca:#79818D;
  --linha:#2A3039;
  --linha-forte:#3C4450;
  --acento:#6FB59A;
  --acento-tinta:#8FCBB3;
  --acento-fundo:#1B2E29;
  --atraso:#E9925A;
  --andamento:#D6AC61;
  --andamento-fundo:#2E2617;
  --sombra:0 1px 1px rgba(0,0,0,.3), 0 10px 26px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:"Public Sans","Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.5;
  padding-block:28px 64px;
  padding-inline:16px;
  -webkit-font-smoothing:antialiased;
}
.folha{max-width:680px;margin:0 auto}

:is(button,input,textarea,select):focus-visible{
  outline:2px solid var(--acento);
  outline-offset:2px;
  border-radius:4px;
}

/* ---------- cabeçalho ---------- */
.topo{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px 20px;
}
.topo h1{
  font-family:"Newsreader",Georgia,"Times New Roman",serif;
  font-weight:600;
  font-size:34px;
  line-height:1.1;
  letter-spacing:-.015em;
  margin:0;
  text-wrap:balance;
}
.resumo{
  margin:6px 0 0;
  font-size:13.5px;
  color:var(--tinta-suave);
  font-variant-numeric:tabular-nums;
}
.resumo b{font-weight:600;color:var(--tinta)}
.resumo .vermelho{color:var(--atraso)}
.data-hoje{
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--tinta-fraca);
  padding-bottom:3px;
}

/* ---------- abas ---------- */
.abas{
  display:flex;
  gap:18px;
  margin-top:14px;
  border-bottom:1px solid var(--linha);
}
.abas button{
  border:0;
  background:transparent;
  color:var(--tinta-fraca);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:0 0 9px;
  margin-bottom:-1px;
  border-bottom:2px solid transparent;
  cursor:pointer;
}
.abas button:hover{color:var(--tinta-suave)}
.abas button[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--acento)}

/* ---------- adicionar ---------- */
.adicionar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
  padding:10px;
  background:var(--superficie);
  border:1px solid var(--linha);
  border-radius:var(--raio);
  box-shadow:var(--sombra);
}
.adicionar input[type="text"]{
  flex:1 1 200px;
  min-width:0;
  border:0;
  background:transparent;
  color:var(--tinta);
  font:inherit;
  font-size:15.5px;
  padding:7px 6px;
}
.adicionar input[type="text"]::placeholder{color:var(--tinta-fraca)}
.adicionar input[type="date"],
.adicionar input[type="time"]{
  flex:0 1 142px;
  border:1px solid var(--linha);
  border-radius:6px;
  background:var(--papel);
  color:var(--tinta-suave);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12.5px;
  padding:6px 8px;
}
.adicionar input[type="time"]{flex:0 1 104px}
.botao-principal{
  flex:0 0 auto;
  border:0;
  border-radius:6px;
  background:var(--acento);
  color:#fff;
  font:inherit;
  font-weight:600;
  font-size:14px;
  padding:8px 18px;
  cursor:pointer;
  transition:background .15s ease;
}
:root[data-theme="dark"] .botao-principal,
:root:not([data-theme="light"]) .botao-principal{color:var(--papel)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .botao-principal{color:#fff}}
.botao-principal:hover{background:var(--acento-tinta)}

/* ---------- filtros ---------- */
.filtros{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.filtros button{
  border:1px solid var(--linha);
  background:transparent;
  color:var(--tinta-suave);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;
  letter-spacing:.04em;
  padding:4px 10px;
  border-radius:999px;
  cursor:pointer;
}
.filtros button:hover{border-color:var(--linha-forte);color:var(--tinta)}
.filtros button[aria-pressed="true"]{
  background:var(--acento-fundo);
  border-color:transparent;
  color:var(--acento-tinta);
  font-weight:500;
}

/* ---------- aviso de exemplos ---------- */
.aviso{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px 12px;
  margin-top:14px;
  padding:9px 12px;
  border-left:2px solid var(--andamento);
  background:var(--andamento-fundo);
  color:var(--andamento);
  font-size:13px;
  border-radius:0 6px 6px 0;
}
.aviso button{
  border:0;background:transparent;color:inherit;font:inherit;
  font-weight:600;text-decoration:underline;cursor:pointer;padding:0;
}

/* ---------- seções / dias ---------- */
.secao{margin-top:24px}
.cabeca-dia{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:4px 10px;
  margin:0 0 8px;
}
.cabeca-dia .nome{
  font-family:"Newsreader",Georgia,serif;
  font-size:19px;
  font-weight:600;
  letter-spacing:-.01em;
  color:var(--tinta);
}
.cabeca-dia .detalhe,
.cabeca-dia .qtd{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--tinta-fraca);
}
.cabeca-dia .qtd{margin-left:auto;font-variant-numeric:tabular-nums}
.secao.urgente .cabeca-dia .nome{color:var(--atraso)}
.painel{
  background:var(--superficie);
  border:1px solid var(--linha);
  border-radius:var(--raio);
  box-shadow:var(--sombra);
  overflow:hidden;
}
.dia-vazio{
  padding:14px 16px;
  font-size:13.5px;
  color:var(--tinta-fraca);
  font-style:italic;
}

/* ---------- item ---------- */
.item{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  column-gap:10px;
  padding:0 12px 0 10px;
  border-left:2px solid transparent;
  border-top:1px solid var(--linha);
}
.item:first-child{border-top:0}
.item.atrasada{border-left-color:var(--atraso)}
.item.andando{border-left-color:var(--andamento)}
.item.aberto{background:var(--recuo)}

.marcar{
  margin-top:10px;
  width:19px;height:19px;
  display:grid;place-items:center;
  border:1.5px solid var(--linha-forte);
  border-radius:50%;
  background:transparent;
  color:var(--acento);
  cursor:pointer;
  padding:0;
  transition:border-color .15s ease, background .15s ease;
}
.marcar svg{width:11px;height:11px;opacity:0;transition:opacity .15s ease}
.marcar:hover{border-color:var(--acento)}
.marcar:hover svg{opacity:.5}
.item.feita .marcar{background:var(--acento);border-color:var(--acento);color:var(--superficie)}
.item.feita .marcar svg{opacity:1}

.linha{
  display:block;
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:inherit;
  font:inherit;
  cursor:pointer;
  padding:8px 0 9px;
}
.titulo{display:block;font-size:15px;line-height:1.35;color:var(--tinta)}
.item.feita .titulo{color:var(--tinta-fraca);text-decoration:line-through;text-decoration-thickness:1px}
.meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:3px 8px;
  margin-top:3px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;
  letter-spacing:.03em;
  color:var(--tinta-fraca);
}
.meta:empty{display:none}
.meta .prazo.vencido,.meta .hora.vencido{color:var(--atraso)}
.meta .prazo.agora,.meta .hora.agora{color:var(--acento-tinta)}
.meta .hora{font-weight:500;color:var(--tinta-suave)}
.selo{padding:1px 7px;border-radius:999px;background:var(--recuo);color:var(--tinta-suave)}
.item.aberto .selo{background:var(--superficie)}
.selo.andamento{background:var(--andamento-fundo);color:var(--andamento)}
.selo.exemplo{background:transparent;border:1px dashed var(--linha-forte);color:var(--tinta-fraca)}

/* ---------- rascunho aberto ---------- */
.edicao{padding:6px 0 10px}
.escrita{
  display:block;
  width:100%;
  border:0;
  background:transparent;
  color:var(--tinta);
  font:inherit;
  padding:0;
  margin:0;
  resize:none;
  overflow:hidden;
}
.escrita::placeholder{color:var(--tinta-fraca)}
.escrita.titulo-edit{font-size:15px;line-height:1.35;padding:2px 0}
.escrita.nota-edit{
  font-size:13.5px;
  line-height:1.45;
  color:var(--tinta-suave);
  margin-top:3px;
  padding-left:9px;
  border-left:1px solid var(--linha-forte);
}
.ferramentas{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:5px;
  margin-top:8px;
}
.chip{
  border:1px solid var(--linha-forte);
  background:var(--superficie);
  color:var(--tinta-suave);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;
  letter-spacing:.03em;
  line-height:1.4;
  padding:3px 9px;
  border-radius:999px;
  cursor:pointer;
}
.chip:hover{color:var(--tinta);border-color:var(--tinta-fraca)}
.chip.perigo{margin-left:auto;border-color:transparent;color:var(--tinta-fraca)}
.chip.perigo:hover{color:var(--atraso);border-color:var(--atraso)}
input.chip{cursor:text}
input.chip[type="date"]{width:118px;padding-block:2px}
input.chip[type="time"]{width:84px;padding-block:2px}
input.chip.categoria{width:108px}
input.chip.categoria::placeholder{color:var(--tinta-fraca)}
input.chip.preenchido{background:var(--acento-fundo);border-color:transparent;color:var(--acento-tinta)}

/* ---------- histórico ---------- */
.periodo{
  display:flex;
  flex-wrap:wrap;
  gap:14px 26px;
  margin-top:20px;
  padding:14px 16px;
  background:var(--superficie);
  border:1px solid var(--linha);
  border-radius:var(--raio);
  box-shadow:var(--sombra);
}
.celula{display:flex;flex-direction:column;gap:1px}
.celula .numero{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:21px;
  font-weight:500;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
  color:var(--tinta);
}
.celula .rotulo{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--tinta-fraca);
}
.celula.boa .numero{color:var(--acento-tinta)}
.celula.ruim .numero{color:var(--atraso)}

.legenda{
  display:flex;
  flex-wrap:wrap;
  gap:6px 16px;
  margin-top:14px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;
  color:var(--tinta-suave);
}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.amostra{width:22px;height:9px;border-radius:3px;display:inline-block}
.amostra.dentro{background:var(--acento)}
.amostra.fora{
  background-color:var(--atraso);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 2px,transparent 2px 5px);
}

.dia-hist{
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--linha);
}
.dia-hist:first-child{border-top:0;padding-top:0}
.contagens{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;
  letter-spacing:.03em;
  color:var(--tinta-suave);
  font-variant-numeric:tabular-nums;
  margin:2px 0 8px;
}
.trilho{
  height:9px;
  background:var(--recuo);
  border-radius:3px;
  overflow:hidden;
  margin-bottom:10px;
}
.faixa{display:flex;gap:2px;height:100%;min-width:3px}
.tramo{border-radius:3px;min-width:3px}
.tramo.dentro{background:var(--acento)}
.tramo.fora{
  background-color:var(--atraso);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 2px,transparent 2px 5px);
}
.registro{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.registro li{
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:4px 9px;
  font-size:14px;
  color:var(--tinta-suave);
  padding-left:16px;
  position:relative;
}
.registro .marca{
  position:absolute;
  left:0;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12px;
  font-weight:500;
}
.registro .marca.dentro{color:var(--acento-tinta)}
.registro .marca.fora{color:var(--atraso)}
.registro .marca.neutra{color:var(--tinta-fraca)}
.registro .veredito{
  margin-left:auto;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;
  letter-spacing:.05em;
  text-transform:uppercase;
  white-space:nowrap;
}
.registro .veredito.dentro{color:var(--acento-tinta)}
.registro .veredito.fora{color:var(--atraso)}
.registro .veredito.neutra{color:var(--tinta-fraca)}

/* ---------- vazio / rodapé ---------- */
.vazio{
  margin-top:26px;
  padding:34px 20px;
  text-align:center;
  border:1px dashed var(--linha-forte);
  border-radius:var(--raio);
  color:var(--tinta-suave);
}
.vazio p{margin:0}
.vazio p + p{margin-top:6px;font-size:13px;color:var(--tinta-fraca)}
.vazio .serif{font-family:"Newsreader",Georgia,serif;font-size:19px;color:var(--tinta)}
.mais{
  margin-top:16px;
  border:0;background:transparent;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tinta-fraca);cursor:pointer;padding:0;
}
.mais:hover{color:var(--tinta)}
.rodape{
  margin-top:34px;
  padding-top:12px;
  border-top:1px solid var(--linha);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;
  letter-spacing:.06em;
  color:var(--tinta-fraca);
  display:flex;
  flex-wrap:wrap;
  gap:4px 14px;
  justify-content:space-between;
}

@media (max-width:520px){
  .topo h1{font-size:28px}
  .chip.perigo{margin-left:0}
  .cabeca-dia .qtd{margin-left:0}
  .registro .veredito{margin-left:0;width:100%}
  .periodo{gap:12px 20px}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>

<div class="folha">
  <header class="topo">
    <div>
      <h1>Minha Pauta</h1>
      <p class="resumo" id="resumo">Carregando suas atividades…</p>
    </div>
    <div class="data-hoje" id="dataHoje"></div>
  </header>

  <nav class="abas" id="abas" role="tablist" aria-label="Seções">
    <button type="button" role="tab" data-vista="agenda" aria-selected="true">Agenda</button>
    <button type="button" role="tab" data-vista="historico" aria-selected="false">Histórico</button>
  </nav>

  <form class="adicionar" id="formAdd" autocomplete="off">
    <input type="text" id="campoNova" placeholder="O que precisa ser feito?" aria-label="Nova atividade" maxlength="300">
    <input type="date" id="campoPrazo" aria-label="Dia da nova atividade">
    <input type="time" id="campoHora" aria-label="Horário da nova atividade" hidden>
    <button type="submit" class="botao-principal">Adicionar</button>
  </form>

  <div class="filtros" id="filtros" hidden></div>
  <div class="aviso" id="avisoExemplos" hidden>
    <span>As atividades marcadas como <b>exemplo</b> vieram prontas só para mostrar como a pauta funciona.</span>
    <button type="button" id="limparExemplos">Remover exemplos</button>
  </div>

  <main id="listas"></main>

  <p class="rodape">
    <span id="modoArmazenamento">Preparando…</span>
    <span id="totalGeral"></span>
  </p>
</div>

<datalist id="listaCategorias"></datalist>

<script>
(function(){
  "use strict";

  var COLECAO = "atividades";
  var CHAVE_DADOS = "minha-pauta:atividades:v1";
  var CHAVE_PREF  = "minha-pauta:preferencias:v1";
  var DIAS_VISIVEIS = 10;

  var estado = {
    tarefas: new Map(),
    vista: "agenda",
    aberto: null,        // uma atividade em edição por vez
    mostrarNota: false,  // a anotação da atividade aberta está à vista
    pendentes: new Set(),
    filtro: "todas",
    verTudo: false,
    modo: "carregando",
    pronto: false,
    assinatura: ""
  };

  var db = null;
  var temporizadores = new Map();

  /* ---------------- utilidades ---------------- */

  function esc(v){
    return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function plural(n, um, muitos){ return n + " " + (n === 1 ? um : muitos); }

  function doisDigitos(n){ return (n < 10 ? "0" : "") + n; }

  function isoDe(d){
    return d.getFullYear() + "-" + doisDigitos(d.getMonth() + 1) + "-" + doisDigitos(d.getDate());
  }

  function isoHoje(){ return isoDe(new Date()); }

  function horaDe(d){ return doisDigitos(d.getHours()) + ":" + doisDigitos(d.getMinutes()); }

  function dataDeIso(iso){
    var p = String(iso).split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  // "2026-09-18T14:30:00Z" -> o dia local em que isso aconteceu
  function diaDoCarimbo(carimbo){
    var d = new Date(carimbo);
    return isNaN(d.getTime()) ? "" : isoDe(d);
  }

  function somarDias(iso, n){
    var d = dataDeIso(iso);
    d.setDate(d.getDate() + n);
    return isoDe(d);
  }

  function diasAte(iso){
    return Math.round((dataDeIso(iso) - dataDeIso(isoHoje())) / 86400000);
  }

  function dataLonga(iso){
    return new Intl.DateTimeFormat("pt-BR", { weekday:"long", day:"numeric", month:"long" }).format(dataDeIso(iso));
  }

  function dataCurta(iso){
    var d = dataDeIso(iso);
    var opcoes = { day:"numeric", month:"short" };
    if (d.getFullYear() !== new Date().getFullYear()) opcoes.year = "numeric";
    return new Intl.DateTimeFormat("pt-BR", opcoes).format(d).replace(/\.$/, "");
  }

  function rotuloDia(iso){
    var n = diasAte(iso);
    if (n === 0) return { nome:"Hoje", detalhe: dataLonga(iso) };
    if (n === 1) return { nome:"Amanhã", detalhe: dataLonga(iso) };
    if (n === -1) return { nome:"Ontem", detalhe: dataLonga(iso) };
    return { nome: dataLonga(iso), detalhe: "" };
  }

  function rotuloPrazo(iso){
    var n = diasAte(iso);
    if (n === 0) return "hoje";
    if (n === 1) return "amanhã";
    if (n === -1) return "ontem";
    var texto = dataCurta(iso);
    if (n < -1) return texto + " · " + Math.abs(n) + " dias atrás";
    if (n <= 7) return texto + " · em " + n + " dias";
    return texto;
  }

  function novoId(){
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  function normalizar(id, bruto){
    var d = bruto || {};
    var status = d.status === "concluida" || d.status === "andamento" ? d.status : "aberta";
    return {
      id: id,
      titulo: typeof d.titulo === "string" ? d.titulo : "",
      notas: typeof d.notas === "string" ? d.notas : "",
      prazo: typeof d.prazo === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d.prazo) ? d.prazo : "",
      hora: typeof d.hora === "string" && /^\d{2}:\d{2}$/.test(d.hora) ? d.hora : "",
      categoria: typeof d.categoria === "string" ? d.categoria.trim() : "",
      status: status,
      exemplo: d.exemplo === true,
      criadaEm: typeof d.criadaEm === "string" ? d.criadaEm : new Date().toISOString(),
      iniciadaEm: typeof d.iniciadaEm === "string" ? d.iniciadaEm : "",
      concluidaEm: typeof d.concluidaEm === "string" ? d.concluidaEm : "",
      noPrazo: d.noPrazo === true || d.noPrazo === false ? d.noPrazo : null
    };
  }

  function corpo(t){
    return {
      titulo: t.titulo, notas: t.notas, prazo: t.prazo, hora: t.hora, categoria: t.categoria,
      status: t.status, exemplo: t.exemplo, criadaEm: t.criadaEm, iniciadaEm: t.iniciadaEm,
      concluidaEm: t.concluidaEm, noPrazo: t.noPrazo
    };
  }

  // Uma atividade passou do ponto quando o dia já foi, ou quando é hoje e a hora marcada passou.
  function estaAtrasada(t, hoje){
    if (t.status === "concluida" || !t.prazo) return false;
    if (t.prazo < hoje) return true;
    return t.prazo === hoje && !!t.hora && t.hora < horaDe(new Date());
  }

  // Comparado no momento em que foi concluída; null quando não havia prazo para cumprir.
  function julgarEntrega(t, quando){
    if (!t.prazo) return null;
    var limite = dataDeIso(t.prazo);
    if (t.hora) {
      var p = t.hora.split(":");
      limite.setHours(Number(p[0]), Number(p[1]), 0, 0);
    } else {
      limite.setHours(23, 59, 59, 999);
    }
    return quando.getTime() <= limite.getTime();
  }

  function atrasoTexto(t){
    if (!t.prazo || !t.concluidaEm) return "";
    var limite = dataDeIso(t.prazo);
    if (t.hora) {
      var p = t.hora.split(":");
      limite.setHours(Number(p[0]), Number(p[1]), 0, 0);
    } else {
      limite.setHours(23, 59, 59, 999);
    }
    var minutos = Math.round((new Date(t.concluidaEm).getTime() - limite.getTime()) / 60000);
    if (minutos <= 0) return "";
    if (minutos < 60) return minutos + " min depois";
    var horas = Math.round(minutos / 60);
    if (horas < 24) return plural(horas, "hora depois", "horas depois");
    return plural(Math.round(horas / 24), "dia depois", "dias depois");
  }

  /* ---------------- preferências (só deste navegador) ---------------- */

  function lerPreferencias(){
    try {
      var cru = window.localStorage.getItem(CHAVE_PREF);
      if (!cru) return;
      var p = JSON.parse(cru);
      if (typeof p.filtro === "string") estado.filtro = p.filtro;
      if (p.vista === "historico" || p.vista === "agenda") estado.vista = p.vista;
    } catch (e) { /* navegação privada ou armazenamento bloqueado */ }
  }

  function gravarPreferencias(){
    try {
      window.localStorage.setItem(CHAVE_PREF, JSON.stringify({
        filtro: estado.filtro, vista: estado.vista
      }));
    } catch (e) { /* segue sem lembrar */ }
  }

  /* ---------------- armazenamento ---------------- */

  function lerLocal(){
    try {
      var cru = window.localStorage.getItem(CHAVE_DADOS);
      if (!cru) return;
      var lista = JSON.parse(cru);
      if (!Array.isArray(lista)) return;
      lista.forEach(function(item){
        if (item && item.id) estado.tarefas.set(item.id, normalizar(item.id, item));
      });
    } catch (e) { /* começa vazio */ }
  }

  function gravarLocal(){
    try {
      var lista = [];
      estado.tarefas.forEach(function(t){ lista.push(Object.assign({ id: t.id }, corpo(t))); });
      window.localStorage.setItem(CHAVE_DADOS, JSON.stringify(lista));
    } catch (e) { /* sem espaço ou bloqueado */ }
  }

  function usarModoLocal(){
    db = null;
    if (estado.tarefas.size === 0) lerLocal();
    estado.modo = "local";
    estado.pronto = true;
    desenhar();
  }

  function conectar(){
    var pedido = null;
    try { pedido = window.claude && window.claude.use ? window.claude.use("db") : null; }
    catch (e) { pedido = null; }

    if (!pedido || typeof pedido.then !== "function") { usarModoLocal(); return; }

    pedido.then(function(ns){
      if (!ns) { usarModoLocal(); return; }
      db = ns;
      estado.modo = "nuvem";
      db.collection(COLECAO).onSnapshot(function(snap){
        var mapa = new Map();
        snap.docs.forEach(function(doc){
          var dados = doc.data();
          if (dados) mapa.set(doc.id, normalizar(doc.id, dados));
        });
        // Uma edição ainda não confirmada continua valendo sobre o que o servidor devolveu.
        estado.pendentes.forEach(function(id){
          var local = estado.tarefas.get(id);
          if (local) mapa.set(id, local); else mapa.delete(id);
        });
        estado.tarefas = mapa;
        estado.pronto = true;
        desenhar();
      }, function(){
        usarModoLocal();
      });
    }, function(){ usarModoLocal(); });
  }

  function gravar(t){
    estado.tarefas.set(t.id, t);
    if (!db) { gravarLocal(); return; }
    estado.pendentes.add(t.id);
    db.collection(COLECAO).doc(t.id).set(corpo(t)).then(function(){
      estado.pendentes.delete(t.id);
    }, function(erro){
      estado.pendentes.delete(t.id);
      relatar(erro);
    });
  }

  function remover(id){
    estado.tarefas.delete(id);
    if (estado.aberto === id) estado.aberto = null;
    if (!db) { gravarLocal(); return; }
    estado.pendentes.add(id);
    db.collection(COLECAO).doc(id).delete().then(function(){
      estado.pendentes.delete(id);
    }, function(erro){
      estado.pendentes.delete(id);
      relatar(erro);
    });
  }

  function relatar(erro){
    var codigo = erro && erro.code;
    var texto = "Não consegui salvar essa mudança. Tente de novo.";
    if (codigo === "quota_exceeded") texto = "A pauta atingiu o limite de atividades guardadas. Apague algumas concluídas para abrir espaço.";
    else if (codigo === "resource_exhausted") texto = "Muitas mudanças de uma vez. Espere um instante e repita.";
    else if (codigo === "revoked" || codigo === "not_granted") texto = "Perdi o acesso ao armazenamento desta página. Recarregue para continuar.";
    var alvo = document.getElementById("modoArmazenamento");
    if (alvo) alvo.textContent = texto;
  }

  function adiar(id, fn){
    if (temporizadores.has(id)) window.clearTimeout(temporizadores.get(id));
    temporizadores.set(id, window.setTimeout(function(){
      temporizadores.delete(id);
      fn();
    }, 700));
  }

  /* ---------------- foco e altura ---------------- */

  function capturarFoco(){
    var el = document.activeElement;
    if (!el || !el.id) return null;
    var f = { id: el.id };
    try { if (typeof el.selectionStart === "number") { f.ini = el.selectionStart; f.fim = el.selectionEnd; } }
    catch (e) { /* campos de data e hora não expõem seleção */ }
    return f;
  }

  function restaurarFoco(f){
    if (!f) return;
    var el = document.getElementById(f.id);
    if (!el) return;
    try {
      el.focus({ preventScroll: true });
      if (typeof f.ini === "number" && el.setSelectionRange) el.setSelectionRange(f.ini, f.fim);
    } catch (e) { /* ignora */ }
  }

  function crescer(el){
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  /* ---------------- agenda ---------------- */

  function metaHtml(t, hoje, comData){
    var partes = [];
    if (t.status === "andamento") partes.push('<span class="selo andamento">em andamento</span>');
    var atrasada = estaAtrasada(t, hoje);
    var tom = atrasada ? " vencido" : (t.status !== "concluida" && t.prazo === hoje ? " agora" : "");
    if (t.prazo && comData) partes.push('<span class="prazo' + tom + '">' + esc(rotuloPrazo(t.prazo)) + "</span>");
    if (t.hora) partes.push('<span class="hora' + tom + '">' + esc(t.hora) + "</span>");
    if (t.categoria) partes.push('<span class="selo">' + esc(t.categoria) + "</span>");
    if (t.exemplo) partes.push('<span class="selo exemplo">exemplo</span>');
    return partes.join("");
  }

  function corpoAbertoHtml(t){
    var comNota = estado.mostrarNota || !!t.notas;
    var html = '<div class="edicao">' +
      '<textarea class="escrita titulo-edit" id="titulo-' + esc(t.id) + '" data-campo="titulo" rows="1" ' +
        'aria-label="Título da atividade" placeholder="Escreva a atividade…">' + esc(t.titulo) + "</textarea>";

    if (comNota) {
      html += '<textarea class="escrita nota-edit" id="notas-' + esc(t.id) + '" data-campo="notas" rows="1" ' +
        'aria-label="Anotação" placeholder="anotação…">' + esc(t.notas) + "</textarea>";
    }

    html += '<div class="ferramentas">' +
      '<input type="date" class="chip' + (t.prazo ? " preenchido" : "") + '" id="prazo-' + esc(t.id) + '" ' +
        'data-campo="prazo" aria-label="Dia" value="' + esc(t.prazo) + '">';

    if (t.prazo) {
      html += '<input type="time" class="chip' + (t.hora ? " preenchido" : "") + '" id="hora-' + esc(t.id) + '" ' +
        'data-campo="hora" aria-label="Horário" value="' + esc(t.hora) + '">';
    }

    html += '<input type="text" class="chip categoria' + (t.categoria ? " preenchido" : "") + '" id="categoria-' + esc(t.id) + '" ' +
        'data-campo="categoria" list="listaCategorias" maxlength="40" placeholder="categoria" ' +
        'aria-label="Categoria" value="' + esc(t.categoria) + '">' +
      '<button type="button" class="chip" data-acao="andamento">' + (t.status === "andamento" ? "pausar" : "começar") + "</button>";

    if (!comNota) html += '<button type="button" class="chip" data-acao="nota">+ anotação</button>';

    html += '<button type="button" class="chip perigo" data-acao="excluir">excluir</button>' +
      "</div></div>";
    return html;
  }

  function itemHtml(t, hoje, comData){
    var aberto = estado.aberto === t.id;
    var feita = t.status === "concluida";
    var classes = ["item"];
    if (feita) classes.push("feita");
    else if (t.status === "andamento") classes.push("andando");
    else if (estaAtrasada(t, hoje)) classes.push("atrasada");
    if (aberto) classes.push("aberto");

    var rotuloBotao = (feita ? "Reabrir" : "Concluir") + ": " + (t.titulo || "atividade sem título");

    var interior = aberto
      ? corpoAbertoHtml(t)
      : '<button type="button" class="linha" data-acao="abrir">' +
          '<span class="titulo">' + (t.titulo ? esc(t.titulo) : "<em>sem título</em>") + "</span>" +
          '<span class="meta">' + metaHtml(t, hoje, comData) + "</span>" +
        "</button>";

    return '<article class="' + classes.join(" ") + '" data-id="' + esc(t.id) + '">' +
      '<button type="button" class="marcar" data-acao="alternar" aria-pressed="' + feita + '" aria-label="' + esc(rotuloBotao) + '">' +
        '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 8.4l3.2 3.2 6.4-7.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      "</button>" + interior + "</article>";
  }

  function cabecaHtml(nome, detalhe, qtd){
    return '<div class="cabeca-dia"><span class="nome">' + esc(nome) + "</span>" +
      (detalhe ? '<span class="detalhe">' + esc(detalhe) + "</span>" : "") +
      (qtd ? '<span class="qtd">' + esc(qtd) + "</span>" : "") +
    "</div>";
  }

  function porHorario(a, b){
    var ha = a.hora || "99:99", hb = b.hora || "99:99";
    if (ha !== hb) return ha < hb ? -1 : 1;
    return a.criadaEm < b.criadaEm ? -1 : 1;
  }

  function desenharAgenda(visiveis, hoje){
    var html = "";

    var atrasadas = [], semData = [], porDia = new Map(), concluidasHoje = [];
    visiveis.forEach(function(t){
      if (t.status === "concluida") {
        if (diaDoCarimbo(t.concluidaEm) === hoje) concluidasHoje.push(t);
        return;
      }
      if (estaAtrasada(t, hoje)) { atrasadas.push(t); return; }
      if (!t.prazo) { semData.push(t); return; }
      if (!porDia.has(t.prazo)) porDia.set(t.prazo, []);
      porDia.get(t.prazo).push(t);
    });

    atrasadas.sort(function(a, b){
      var ka = a.prazo + (a.hora || "99:99"), kb = b.prazo + (b.hora || "99:99");
      if (ka !== kb) return ka < kb ? -1 : 1;
      return a.criadaEm < b.criadaEm ? -1 : 1;
    });

    if (atrasadas.length) {
      html += '<section class="secao urgente">' +
        cabecaHtml("Passou do ponto", "", String(atrasadas.length)) +
        '<div class="painel">' +
          atrasadas.map(function(t){ return itemHtml(t, hoje, true); }).join("") +
        "</div></section>";
    }

    // O dia de hoje sempre aparece; os demais só quando têm algo marcado.
    var dias = Array.from(porDia.keys()).filter(function(d){ return d >= hoje; });
    if (dias.indexOf(hoje) === -1) dias.push(hoje);
    dias.sort();

    dias.forEach(function(dia){
      var itens = (porDia.get(dia) || []).slice().sort(porHorario);
      if (dia === hoje) itens = itens.concat(concluidasHoje);
      var r = rotuloDia(dia);
      html += '<section class="secao">' + cabecaHtml(r.nome, r.detalhe, itens.length ? String(itens.length) : "");
      html += itens.length
        ? '<div class="painel">' + itens.map(function(t){ return itemHtml(t, hoje, false); }).join("") + "</div>"
        : '<div class="painel"><p class="dia-vazio">Nada marcado para hoje.</p></div>';
      html += "</section>";
    });

    if (semData.length) {
      semData.sort(function(a, b){
        if ((a.status === "andamento") !== (b.status === "andamento")) return a.status === "andamento" ? -1 : 1;
        return a.criadaEm < b.criadaEm ? -1 : 1;
      });
      html += '<section class="secao">' +
        cabecaHtml("Sem data", "quando der", String(semData.length)) +
        '<div class="painel">' + semData.map(function(t){ return itemHtml(t, hoje, false); }).join("") + "</div></section>";
    }

    return html;
  }

  /* ---------------- histórico ---------------- */

  function agregar(visiveis){
    var mapa = new Map();
    function dia(d){
      if (!mapa.has(d)) mapa.set(d, { dia:d, criadas:0, iniciadas:0, feitas:[], dentro:0, fora:0, semPrazo:0 });
      return mapa.get(d);
    }
    visiveis.forEach(function(t){
      var d;
      d = diaDoCarimbo(t.criadaEm);   if (d) dia(d).criadas++;
      d = diaDoCarimbo(t.iniciadaEm); if (d) dia(d).iniciadas++;
      d = diaDoCarimbo(t.concluidaEm);
      if (d && t.status === "concluida") {
        var r = dia(d);
        r.feitas.push(t);
        if (t.noPrazo === true) r.dentro++;
        else if (t.noPrazo === false) r.fora++;
        else r.semPrazo++;
      }
    });
    return Array.from(mapa.values()).sort(function(a, b){ return a.dia > b.dia ? -1 : 1; });
  }

  function desenharHistorico(visiveis, hoje){
    var registros = agregar(visiveis);
    if (!registros.length) {
      return '<div class="vazio"><p class="serif">O histórico começa agora.</p>' +
        "<p>Conforme você criar, começar e concluir atividades, cada dia vira uma linha aqui.</p></div>";
    }

    // Resumo dos últimos 7 dias, incluindo hoje.
    var corte = somarDias(hoje, -6);
    var soma = { criadas:0, iniciadas:0, feitas:0, dentro:0, fora:0 };
    registros.forEach(function(r){
      if (r.dia < corte || r.dia > hoje) return;
      soma.criadas += r.criadas;
      soma.iniciadas += r.iniciadas;
      soma.feitas += r.feitas.length;
      soma.dentro += r.dentro;
      soma.fora += r.fora;
    });

    var html = '<section class="secao">' +
      cabecaHtml("Últimos 7 dias", dataCurta(corte) + " – " + dataCurta(hoje), "") +
      '<div class="periodo">' +
        celulaHtml(soma.criadas, "criadas", "") +
        celulaHtml(soma.iniciadas, "iniciadas", "") +
        celulaHtml(soma.feitas, "concluídas", "") +
        celulaHtml(soma.dentro, "no prazo", "boa") +
        celulaHtml(soma.fora, "fora do prazo", "ruim") +
      "</div>" +
      '<div class="legenda">' +
        '<span><i class="amostra dentro"></i>entregue no prazo</span>' +
        '<span><i class="amostra fora"></i>entregue fora do prazo</span>' +
      "</div></section>";

    // A escala das barras é comum a todos os dias mostrados, para poderem ser comparados.
    var mostrados = estado.verTudo ? registros : registros.slice(0, DIAS_VISIVEIS);
    var teto = 1;
    mostrados.forEach(function(r){ if (r.feitas.length > teto) teto = r.feitas.length; });

    html += '<section class="secao">';
    mostrados.forEach(function(r){ html += diaHistoricoHtml(r, teto); });
    html += "</section>";

    if (registros.length > DIAS_VISIVEIS) {
      html += '<button type="button" class="mais" data-acao="verTudo">' +
        (estado.verTudo ? "Mostrar menos" : "Ver todos os " + registros.length + " dias") + "</button>";
    }
    return html;
  }

  function celulaHtml(n, rotulo, tom){
    return '<div class="celula' + (tom ? " " + tom : "") + '">' +
      '<span class="numero">' + n + "</span>" +
      '<span class="rotulo">' + esc(rotulo) + "</span></div>";
  }

  function diaHistoricoHtml(r, teto){
    var total = r.feitas.length;
    var rot = rotuloDia(r.dia);

    var html = '<article class="dia-hist">' + cabecaHtml(rot.nome, rot.detalhe, "");
    html += '<p class="contagens">' +
      r.criadas + " criadas · " + r.iniciadas + " iniciadas · " + total + " concluídas</p>";

    if (total) {
      var largura = Math.max(6, Math.round((total / teto) * 100));
      var descricao = r.dentro + " no prazo, " + r.fora + " fora do prazo" +
        (r.semPrazo ? ", " + r.semPrazo + " sem prazo definido" : "");
      html += '<div class="trilho"><div class="faixa" style="width:' + largura + '%" role="img" aria-label="' + esc(descricao) + '">';
      if (r.dentro) html += '<span class="tramo dentro" style="flex:' + r.dentro + '"></span>';
      if (r.fora) html += '<span class="tramo fora" style="flex:' + r.fora + '"></span>';
      if (r.semPrazo) html += '<span class="tramo" style="flex:' + r.semPrazo + ';background:var(--linha-forte)"></span>';
      html += "</div></div>";

      html += '<ul class="registro">';
      r.feitas.slice().sort(function(a, b){ return a.concluidaEm < b.concluidaEm ? -1 : 1; }).forEach(function(t){
        var tom = t.noPrazo === true ? "dentro" : (t.noPrazo === false ? "fora" : "neutra");
        var marca = t.noPrazo === true ? "✓" : (t.noPrazo === false ? "!" : "·");
        var veredito = t.noPrazo === true
          ? "no prazo"
          : (t.noPrazo === false ? (atrasoTexto(t) || "fora do prazo") : "sem prazo");
        html += "<li>" +
          '<span class="marca ' + tom + '" aria-hidden="true">' + marca + "</span>" +
          "<span>" + (t.titulo ? esc(t.titulo) : "<em>sem título</em>") + "</span>" +
          '<span class="veredito ' + tom + '">' + esc(veredito) + "</span></li>";
      });
      html += "</ul>";
    }

    return html + "</article>";
  }

  /* ---------------- desenho ---------------- */

  function assinaturaTempo(){
    var hoje = isoHoje(), ids = [];
    estado.tarefas.forEach(function(t){ if (estaAtrasada(t, hoje)) ids.push(t.id); });
    return hoje + "|" + ids.sort().join(",");
  }

  function desenhar(){
    var foco = capturarFoco();
    var hoje = isoHoje();
    var todas = Array.from(estado.tarefas.values());

    if (estado.aberto && !estado.tarefas.has(estado.aberto)) estado.aberto = null;

    var categorias = [];
    todas.forEach(function(t){
      if (t.categoria && categorias.indexOf(t.categoria) === -1) categorias.push(t.categoria);
    });
    categorias.sort(function(a, b){ return a.localeCompare(b, "pt-BR"); });
    if (estado.filtro !== "todas" && categorias.indexOf(estado.filtro) === -1) estado.filtro = "todas";

    var visiveis = estado.filtro === "todas"
      ? todas
      : todas.filter(function(t){ return t.categoria === estado.filtro; });

    var naAgenda = estado.vista === "agenda";

    // Abas
    Array.prototype.forEach.call(document.querySelectorAll("#abas button"), function(b){
      b.setAttribute("aria-selected", String(b.getAttribute("data-vista") === estado.vista));
    });
    document.getElementById("formAdd").hidden = !naAgenda;

    // Resumo
    var abertas = 0, atrasadas = 0, deHoje = 0;
    visiveis.forEach(function(t){
      if (t.status === "concluida") return;
      abertas++;
      if (estaAtrasada(t, hoje)) atrasadas++;
      else if (t.prazo === hoje) deHoje++;
    });
    var resumo;
    if (!estado.pronto) {
      resumo = "Carregando suas atividades…";
    } else if (abertas === 0) {
      resumo = "Nada em aberto.";
    } else {
      var trechos = ["<b>" + plural(abertas, "atividade aberta", "atividades abertas") + "</b>"];
      if (atrasadas) trechos.push('<span class="vermelho">' + plural(atrasadas, "passou do ponto", "passaram do ponto") + "</span>");
      if (deHoje) trechos.push(deHoje + " para hoje");
      resumo = trechos.join(" · ");
    }
    document.getElementById("resumo").innerHTML = resumo;

    // Filtros por categoria
    var caixaFiltros = document.getElementById("filtros");
    if (categorias.length) {
      var botoes = ['<button type="button" data-filtro="todas" aria-pressed="' + (estado.filtro === "todas") + '">todas</button>'];
      categorias.forEach(function(c){
        botoes.push('<button type="button" data-filtro="' + esc(c) + '" aria-pressed="' + (estado.filtro === c) + '">' + esc(c) + "</button>");
      });
      caixaFiltros.innerHTML = botoes.join("");
      caixaFiltros.hidden = false;
    } else {
      caixaFiltros.innerHTML = "";
      caixaFiltros.hidden = true;
    }

    document.getElementById("listaCategorias").innerHTML =
      categorias.map(function(c){ return '<option value="' + esc(c) + '"></option>'; }).join("");

    document.getElementById("avisoExemplos").hidden = !naAgenda || !todas.some(function(t){ return t.exemplo; });

    // Corpo
    var html;
    if (!estado.pronto) {
      html = '<div class="vazio"><p class="serif">Abrindo sua pauta…</p></div>';
    } else if (naAgenda) {
      html = desenharAgenda(visiveis, hoje);
      if (!html) {
        html = '<div class="vazio"><p class="serif">' +
          (todas.length ? "Nenhuma atividade nesta categoria." : "A pauta está limpa.") + "</p><p>" +
          (todas.length ? "Troque o filtro acima para ver o resto." : "Escreva a primeira atividade no campo acima e aperte Enter.") +
          "</p></div>";
      }
    } else {
      html = desenharHistorico(visiveis, hoje);
    }
    document.getElementById("listas").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll(".escrita"), crescer);

    // Rodapé
    var modo = document.getElementById("modoArmazenamento");
    if (estado.modo === "nuvem") modo.textContent = "Salvo na sua conta · sincroniza entre dispositivos";
    else if (estado.modo === "local") modo.textContent = "Salvo apenas neste navegador";
    else modo.textContent = "Preparando…";
    document.getElementById("totalGeral").textContent =
      todas.length ? plural(todas.length, "atividade no total", "atividades no total") : "";

    estado.assinatura = assinaturaTempo();
    restaurarFoco(foco);
  }

  /* ---------------- ações ---------------- */

  function abrir(id){
    var t = estado.tarefas.get(id);
    estado.aberto = id;
    estado.mostrarNota = !!(t && t.notas);
    desenhar();
    var campo = document.getElementById("titulo-" + id);
    if (campo) {
      campo.focus({ preventScroll: true });
      var fim = campo.value.length;
      try { campo.setSelectionRange(fim, fim); } catch (e) { /* ignora */ }
    }
  }

  function fechar(){
    if (!estado.aberto) return;
    estado.aberto = null;
    estado.mostrarNota = false;
    desenhar();
  }

  function concluir(t){
    var agora = new Date();
    t.status = "concluida";
    t.concluidaEm = agora.toISOString();
    t.noPrazo = julgarEntrega(t, agora);
    // Concluir sem nunca ter começado ainda conta como trabalho feito naquele dia.
    if (!t.iniciadaEm) t.iniciadaEm = t.concluidaEm;
    if (estado.aberto === t.id) { estado.aberto = null; estado.mostrarNota = false; }
  }

  function adicionar(){
    var campo = document.getElementById("campoNova");
    var titulo = campo.value.trim();
    if (!titulo) { campo.focus(); return; }
    var prazo = document.getElementById("campoPrazo").value || "";
    var t = normalizar(novoId(), {
      titulo: titulo,
      prazo: prazo,
      hora: prazo ? (document.getElementById("campoHora").value || "") : "",
      categoria: estado.filtro === "todas" ? "" : estado.filtro,
      criadaEm: new Date().toISOString()
    });
    gravar(t);
    campo.value = "";
    estado.aberto = null;
    desenhar();
    campo.focus();
  }

  function comTarefa(alvo, fn){
    var art = alvo.closest("article.item");
    if (!art) return;
    var t = estado.tarefas.get(art.getAttribute("data-id"));
    if (t) fn(Object.assign({}, t));
  }

  document.getElementById("abas").addEventListener("click", function(e){
    var b = e.target.closest("button[data-vista]");
    if (!b) return;
    estado.vista = b.getAttribute("data-vista");
    estado.aberto = null;
    estado.verTudo = false;
    gravarPreferencias();
    desenhar();
  });

  document.getElementById("formAdd").addEventListener("submit", function(e){
    e.preventDefault();
    adicionar();
  });

  var campoPrazoNovo = document.getElementById("campoPrazo");
  var campoHoraNovo = document.getElementById("campoHora");
  function sincronizarHoraNova(){
    var temData = !!campoPrazoNovo.value;
    campoHoraNovo.hidden = !temData;
    if (!temData) campoHoraNovo.value = "";
  }
  campoPrazoNovo.addEventListener("change", sincronizarHoraNova);
  campoPrazoNovo.addEventListener("input", sincronizarHoraNova);
  sincronizarHoraNova();

  document.getElementById("limparExemplos").addEventListener("click", function(){
    Array.from(estado.tarefas.values()).forEach(function(t){ if (t.exemplo) remover(t.id); });
    desenhar();
  });

  document.getElementById("filtros").addEventListener("click", function(e){
    var b = e.target.closest("button[data-filtro]");
    if (!b) return;
    estado.filtro = b.getAttribute("data-filtro");
    gravarPreferencias();
    desenhar();
  });

  document.getElementById("listas").addEventListener("click", function(e){
    var botao = e.target.closest("button[data-acao]");
    if (!botao) return;
    var acao = botao.getAttribute("data-acao");

    if (acao === "verTudo") {
      estado.verTudo = !estado.verTudo;
      desenhar();
      return;
    }

    comTarefa(botao, function(t){
      if (acao === "abrir") { abrir(t.id); return; }

      if (acao === "nota") {
        estado.mostrarNota = true;
        desenhar();
        var campo = document.getElementById("notas-" + t.id);
        if (campo) campo.focus({ preventScroll: true });
        return;
      }

      if (acao === "excluir") { remover(t.id); desenhar(); return; }

      if (acao === "alternar") {
        if (t.status === "concluida") { t.status = "aberta"; t.concluidaEm = ""; t.noPrazo = null; }
        else concluir(t);
      } else if (acao === "andamento") {
        if (t.status === "andamento") {
          t.status = "aberta";
        } else {
          t.status = "andamento";
          if (!t.iniciadaEm) t.iniciadaEm = new Date().toISOString();
        }
      }

      gravar(t);
      desenhar();
    });
  });

  document.getElementById("listas").addEventListener("input", function(e){
    var campo = e.target.closest("[data-campo]");
    if (!campo) return;
    var nome = campo.getAttribute("data-campo");
    if (nome !== "titulo" && nome !== "notas") return;
    crescer(campo);
    comTarefa(campo, function(t){
      t[nome] = campo.value;
      estado.tarefas.set(t.id, t);
      adiar(t.id, function(){ gravar(estado.tarefas.get(t.id) || t); });
    });
  });

  document.getElementById("listas").addEventListener("change", function(e){
    var campo = e.target.closest("[data-campo]");
    if (!campo) return;
    var nome = campo.getAttribute("data-campo");
    comTarefa(campo, function(t){
      t[nome] = nome === "categoria" ? campo.value.trim() : campo.value;
      if (nome === "prazo" && !campo.value) t.hora = "";
      gravar(t);
      if (nome !== "titulo" && nome !== "notas") desenhar();
    });
  });

  document.getElementById("listas").addEventListener("keydown", function(e){
    if (e.key === "Escape") { fechar(); return; }
    if (e.key !== "Enter" || e.shiftKey) return;
    // Enter fecha o rascunho; Shift+Enter quebra linha na anotação.
    var campo = e.target.closest('[data-campo="titulo"], [data-campo="categoria"]');
    if (!campo) return;
    e.preventDefault();
    fechar();
  });

  // Clicar fora fecha o rascunho aberto.
  document.addEventListener("click", function(e){
    if (!estado.aberto) return;
    var art = e.target.closest("article.item");
    if (art && art.getAttribute("data-id") === estado.aberto) return;
    fechar();
  });

  // A virada de um horário marcado muda o que está atrasado; redesenha só quando isso acontece.
  window.setInterval(function(){
    if (estado.aberto) return;
    if (assinaturaTempo() !== estado.assinatura) desenhar();
  }, 30000);

  /* ---------------- partida ---------------- */

  document.getElementById("dataHoje").textContent =
    new Intl.DateTimeFormat("pt-BR", { weekday:"long", day:"numeric", month:"long" }).format(new Date());

  lerPreferencias();
  desenhar();
  conectar();
})();
</script>
